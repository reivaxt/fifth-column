function chase() {
  rainStart(); sfx.rainOn(); startHeart(); musicStop();
  S.marks.push({ g: S.offset, type: "wander" });
  const segs = [
    { type: "run", text: "The corridor. Rain blows in through the gaps.", need: 8, bg: "search-corridor" },
    { type: "pick", text: "The lift or the stairs?", bg: "search-corridor", opts: [{ t: "The stairs", msg: "You take them two at a time, barefoot.", bg: "search-stairs" }, { t: "The lift", msg: "The lift crawls up from the ground floor. You count every floor.", bg: "search-lift" }] },
    { type: "run", text: "The void deck. The rain is so loud it swallows her name.", need: 8, bg: "search-voiddeck" },
    { type: "pick", text: "Where would she go?", bg: "search-voiddeck", opts: [{ t: "The benches at the void deck", wrong: true, msg: "Only puddles and an empty bench. Not here.", bg: "search-voiddeck" }, { t: "The drop-off point", msg: "A small figure, holding an umbrella.", bg: "search-dropoff" }] },
    { type: "run", text: "Towards the drop-off point.", need: 6, bg: "search-dropoff" }
  ];
  let i = 0;
  const next = () => {
    if (i >= segs.length) { confront(); return; }
    const s = segs[i++];
    if (s.type === "run") runSeg(s, next);
    else pickSeg(s, wrong => { if (wrong) segs.splice(i, 0, { type: "run", text: "You turn back towards the road.", need: 5, bg: "search-voiddeck" }); next(); });
  };
  next();
}
function runSeg(s, done) {
  let n = 0;
  setScene(s.bg);
  show(`<div class="panel night"><p class="scene-line">${s.text}</p><div class="track"><i id="trk"></i></div><div class="ma-zone" id="maz" aria-hidden="true"></div><button class="btn big" data-act="run" data-focus>Run · call “Ma!”</button><p class="hint">Tap quickly, or press Space.</p></div>`, clr(), {
    run: () => {
      if (n >= s.need) return;
      n++;
      const trk = $("#trk"); if (trk) trk.style.width = Math.min(100, n / s.need * 100) + "%";
      const z = $("#maz");
      if (z) { const m = document.createElement("span"); m.className = "ma"; m.textContent = "Ma!"; m.style.left = rand(5, 80) + "%"; z.appendChild(m); setTimeout(() => m.remove(), 900); }
      if (n === s.need) setTimeout(done, 250);
    }
  });
}
function pickSeg(s, done) {

function helpScene() {
  let busy = false, current = null;
  const order = ["sister", "manager", "door", "kids", "daycare"];

  show(`<div class="panel wide"><p class="eyebrow">Ask for help</p><p class="scene-line">Choose three. Every one of them makes the days lighter.</p><span class="count" id="hcount">0 of 3 asked</span>

    <div class="actions" id="hact"></div></div>`, "dark", h);
  const chat = $("#chat"), hact = $("#hact");

    if (busy || S.helpers.includes(k) || S.helpers.length >= 3) return;
    current = k;
    order.forEach(o => $("#hc-" + o).classList.toggle("sel", o === k));
    chat.innerHTML = `<div class="msg me draft">${HELP[k].draft}</div>`;
    hact.innerHTML = `<button class="btn purple" data-act="send">${S.helpers.length === 0 ? "Send it" : "Send"}</button>`;
    hact.querySelector("button").focus({ preventScroll: true });
  }
  function send() {
    if (busy || !current) return;
    busy = true; const k = current; const n = S.helpers.length;

      setTimeout(() => {
        chat.insertAdjacentHTML("beforeend", `<div class="react">${REACT[n]}</div>`);
        S.helpers.push(k); current = null; busy = false;
        const card = $("#hc-" + k); card.classList.add("on"); card.disabled = true;

          hact.querySelector("button").focus({ preventScroll: true });
        }
      }, 650);
    }, wait + 500);
  }
}

  const eff = { sister: "can take Ah Ma’s tasks from 4.30 p.m.", manager: "work is more flexible, and a colleague can cover some tasks", door: "watches the gate at night", kids: "can take their own small jobs before and after school", daycare: "can take Ah Ma’s tasks from 8.30 a.m. to 4.30 p.m." };
  const di = sceneArt("day4-intro", "A calmer morning in the flat a few weeks later");
  show(`<div class="panel${di ? " has-banner" : ""}">${di}<p class="eyebrow">A few weeks later</p><p class="scene-line">The whiteboard has five columns now.</p>
    <ul class="plist">${S.helpers.map(k => `<li>${HELP[k].name}<span>${eff[k]}</span></li>`).join("")}</ul>
    <p class="scene-sub">Ah Ma’s memory has not come back. The days are still full. The new purple column holds Sleep, Eat properly and Ask for help, and it is yours to use. When you sit down to rest now, nobody needs to call you back.</p><p class="scene-sub">When a helper is free, a purple <b>Hand to…</b> button appears under the tasks they can take. Asking takes five minutes. It frees much more.</p><p class="scene-sub">Help doesn’t make the day easy. It makes it possible.</p>
    <div class="actions"><button class="btn purple" data-act="go" data-focus>Start the day</button></div></div>`, "dark", { go: () => startDay(3) });
}
function dinner() {
  setWall(.82);
  const ate = S.self.eat > 0;
  const df = sceneArt("dinner-fish", "Chloe sliding the good piece of fish onto Papa’s plate");
  show(`<div class="panel${df ? " has-banner" : ""}">${df || portrait("fish")}<p class="eyebrow">Day 4 · 7.30 p.m.</p><p class="scene-line">Fish for dinner. One piece is burnt.</p><p class="scene-line">Before you can reach for it, Chloe slides the good piece onto your plate.</p><span class="speaker" style="--c:var(--green)">Chloe</span><p class="say" style="--c:var(--green)">“Papa, you eat this one.”</p><p class="scene-sub">${ate ? "You don’t give it away this time." : "You almost argue. Then you pick up your chopsticks."}</p><div class="actions"><button class="btn purple" data-act="go" data-focus>Look at the whiteboard</button></div></div>`, "dark", { go: reflection });
}

/* ---------- reflection ---------- */
function noteLines() {
  const L = [];
  const hl = { sister: "Thank you for asking Aunty. She was happy to help.", manager: "You came home early today. Marcus showed you his model!", door: "The door alert works. Ah Ma is safe at night.", kids: "Marcus and me can help more. We like helping.", daycare: "Ah Ma made a friend at the day centre." };
  if (S.helpers.length) L.push(hl[S.helpers[0]]);
  if (S.self.eat >= 2) L.push(S.self.sleep ? "You ate properly AND rested. You look less tired :)" : "You ate properly today. Please sleep early too.");
  else if (S.self.eat === 1) L.push("You ate a proper meal today. Let’s make it two tomorrow.");
  else L.push("Papa, please eat properly. We saved you the good piece.");
  if (S.delegated >= 2) L.push("You let Aunty and us help today. It felt nice to help you back.");
  if (S.k.gentle >= S.k.snap + 2) L.push("You were so patient with Ah Ma.");
  else if (S.k.snap >= 2) L.push("It’s okay to be tired, Papa. We love you.");
  else L.push("Ah Ma smiled at you today. I saw.");
  return L;
}
function graphSVG() {
  const W = 680, H = 236, Lm = 44, Rm = 16, Tm = 24, Bm = 34, iw = W - Lm - Rm, ih = H - Tm - Bm;
  const total = S.offset || 1;
  const X = g => (Lm + g / total * iw).toFixed(1), Y = e => (Tm + (1 - e / 100) * ih).toFixed(1);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Papa’s energy across the four days. It falls through days one to three, reaches empty around the crisis, and recovers on day four.">`;
  let acc = 0;
  S.dayLens.forEach(({ n, len }) => {
    const x0 = +X(acc), x1 = +X(acc + len);
    if (n % 2 === 0) s += `<rect class="g-band" x="${x0}" y="${Tm}" width="${(x1 - x0).toFixed(1)}" height="${ih}"/>`;
    s += `<text class="g-lab" x="${((x0 + x1) / 2).toFixed(1)}" y="${H - 12}" text-anchor="middle">Day ${n}</text>`;
    acc += len;
  });
  [[100, "Full"], [50, "Half"], [0, "Empty"]].forEach(([v, l]) => {
    s += `<line class="g-grid" x1="${Lm}" x2="${W - Rm}" y1="${Y(v)}" y2="${Y(v)}"/><text class="g-lab" x="${Lm - 6}" y="${+Y(v) + 4}" text-anchor="end">${l}</text>`;
  });
  const d4 = S.dayLens.filter(x => x.n <= 3).reduce((a, x) => a + x.len, 0);
  if (S.dayLens.some(x => x.n === 4)) {
    s += `<line class="g-crisis" x1="${X(d4)}" x2="${X(d4)}" y1="${Tm - 8}" y2="${Tm + ih}"/>`;
    if (d4 > 0) s += `<text class="g-red" x="${+X(d4) - 6}" y="${Tm - 10}" text-anchor="end">Ah Ma wandered</text>`;
    s += `<text class="g-pur" x="${+X(d4) + 6}" y="${Tm - 10}">Help arrived</text>`;
  }
  const step = Math.max(1, Math.ceil(S.log.length / 380));
  const pts = S.log.filter((_, i) => i % step === 0);
  const a = pts.filter(p => p.g < d4).map(p => `${X(p.g)},${Y(p.e)}`).join(" ");
  const b = pts.filter(p => p.g >= d4).map(p => `${X(p.g)},${Y(p.e)}`).join(" ");
  if (a) s += `<polyline class="g-line g-draw" pathLength="1" points="${a}"/>`;
  if (b) s += `<polyline class="g-line d4 g-draw" pathLength="1" points="${b}" style="animation-delay:2.4s"/>`;
  S.marks.filter(m => m.type === "doze").forEach(m => { s += `<text class="g-z" x="${X(m.g)}" y="${+Y(0) - 6}" text-anchor="middle">z</text>`; });
  return s + `</svg>`;
}
function closing() {
  const dz = S.dozes ? `, and nodded off ${S.dozes === 1 ? "once" : S.dozes === 2 ? "twice" : S.dozes + " times"}` : "";
  const lead = S.missed13 || S.dozes
    ? `For three days, you carried four columns alone. You finished ${S.done13} tasks, let ${S.missed13} slip${dz}.`
    : `For three days, you carried four columns alone. You kept up, but it took nearly everything Papa had.`;
  return `<div class="closing">
    <p class="lead">${lead}</p>
    <p>That isn’t a failure of love. Nobody can carry all of this alone, and nobody should have to.</p>
    <p>Asking for help is how caregivers keep going. There is no shame in it.</p>
    <div class="support">
      <p>If you, or someone you know, is caring for a family member in Singapore:</p>
      <ul>
        <li><b>Agency for Integrated Care (AIC)</b><span>Advice on caregiving and support services</span><span class="num">1800-650-6060</span><a href="https://www.aic.sg" target="_blank" rel="noopener">aic.sg</a></li>
        <li><b>Dementia Singapore · Dementia Helpline</b><span>For families caring for someone with dementia</span><span class="num">6377 0700</span><a href="https://dementia.org.sg" target="_blank" rel="noopener">dementia.org.sg</a></li>
      </ul>
      <p>Check their websites for opening hours.</p>
    </div>
  </div>`;
}
function reflection() {
  setPlay(false); clearSave();
  const lines = noteLines();
  const top = Object.entries(S.inv.by).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const restLine = S.rests.cut ? ` He tried to rest ${S.rests.cut + S.rests.full} time${S.rests.cut + S.rests.full > 1 ? "s" : ""}; ${S.rests.cut} ended early when Ah Ma called.` : "";
  show(`<div class="panel wide">
    <div class="note"><h3>Papa</h3>${lines.map((l, i) => `<p class="fade-in" style="--d:${.4 + i * .8}s">${l}</p>`).join("")}<p class="sig fade-in" style="--d:${.4 + lines.length * .8}s">— Chloe</p></div>
    <span class="played">Time played: ${fmtTime(PLAY.ms)}</span>
    <p class="sec-h">Papa’s energy, all four days</p>
    <div class="graph">${graphSVG()}</div>
    <p class="scene-sub">${S.dozes ? `He nodded off ${S.dozes} time${S.dozes > 1 ? "s" : ""}, each marked with a z. ` : ""}${S.missed} task${S.missed === 1 ? "" : "s"} slipped through.${restLine} On the last day, others carried ${S.helped} task${S.helped === 1 ? "" : "s"} he would have done alone${S.delegated ? `, ${S.delegated} of them because you handed them over` : ""}.${S.madeUp ? ` You made up for ${S.madeUp} missed moment${S.madeUp === 1 ? "" : "s"} later in the day.` : ""}</p>
    ${S.conseq.length ? `<p class="sec-h">How your choices carried forward</p><ul class="conseq">${S.conseq.slice(0, 4).map(t => `<li>${t}</li>`).join("")}</ul>` : ""}
    <p class="sec-h">What never made it onto the board</p>
    <div class="inv"><span class="n" id="invN">0</span><p>small things Papa also did while you played. None of them were ever written down.</p></div>
    <ul class="invlist">${top.map(([k, v]) => `<li>${k}<b>×${v}</b></li>`).join("")}</ul>
    <p class="scene-sub">Joan used to carry most of these. Nobody wrote them down then, either.</p>
    ${closing()}
    <p class="sec-h">Ways to help</p>
    <div class="ways">
      <div><h4>If you are a caregiver</h4><ul>
        <li>Ask early, and ask for something specific: “Can you sit with Ma on Tuesday evenings?”</li>
        <li>Look into day care, home help and respite care before you reach breaking point.</li>
        <li>Tell your employer. Flexible hours are easier to arrange before a crisis than after one.</li>
        <li>Protect a few things for yourself: a proper meal, enough sleep, an hour off.</li></ul></div>
      <div><h4>If you know a caregiver</h4><ul>
        <li>Offer one concrete thing instead of “let me know if you need anything”.</li>
        <li>Check in regularly, even with a short message.</li>
        <li>Listen without judging or rushing to fix things.</li>
        <li>Notice the invisible work, and say thank you for it.</li></ul></div>
    </div>
    <p class="question">Who in your life might be carrying a fifth column nobody has written yet?</p>
    <div class="actions"><button class="btn" data-act="again">Play again</button></div></div>`, "dark", { again: () => { audioInit(); musicStart("day"); S = fresh(); S.di = 0; S.d = DAYS[0]; buildBoard(); PLAY.ms = 0; setPlay(true); intro(); } });
  const el = $("#invN"), target = S.inv.n;
  if (RM) { el.textContent = target; return; }
  const t0 = performance.now();
  (function up(now) { const p = Math.min(1, (now - t0) / 1400); el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(up); })(t0);
}

/* ---------- rain ---------- */
const cv = $("#rain"), rctx = cv.getContext("2d");
const R = { on: false, drops: [], blocks: [], w: 0, h: 0, raf: 0, last: 0 };
function rainSize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  R.w = innerWidth; R.h = innerHeight; cv.width = R.w * dpr; cv.height = R.h * dpr; rctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  R.blocks = [];
  let x = -20;
  while (x < R.w) {
    const bw = rand(110, 190), bh = rand(R.h * .45, R.h * .8), wins = [];
    for (let yy = R.h - bh + 14; yy < R.h - 20; yy += 16) for (let xx = x + 10; xx < x + bw - 12; xx += 14) if (Math.random() < .22) wins.push([xx, yy, rand(.35, .9)]);
    R.blocks.push({ x, w: bw, h: bh, wins }); x += bw + rand(20, 60);
  }
  R.drops = Array.from({ length: Math.round(R.w * R.h / 5200) }, () => ({ x: rand(0, R.w), y: rand(0, R.h), l: rand(12, 26), v: rand(650, 950) }));
}
function rainDraw(dt) {
  if (R.img) { rctx.clearRect(0, 0, R.w, R.h); rctx.fillStyle = "rgba(8,12,18,.3)"; rctx.fillRect(0, 0, R.w, R.h); rainDrops(dt); return; }
  const g = rctx.createLinearGradient(0, 0, 0, R.h);
  g.addColorStop(0, "#0d141d"); g.addColorStop(1, "#1d2a38");
  rctx.fillStyle = g; rctx.fillRect(0, 0, R.w, R.h);
  for (const b of R.blocks) {
    rctx.fillStyle = "#18222e"; rctx.fillRect(b.x, R.h - b.h, b.w, b.h);
    for (const [x, y, a] of b.wins) { rctx.fillStyle = `rgba(242,192,99,${a})`; rctx.fillRect(x, y, 6, 7); }
  }
  rainDrops(dt);
}
function rainDrops(dt) {
  rctx.strokeStyle = "rgba(196,214,232,.38)"; rctx.lineWidth = 1.2; rctx.beginPath();
  for (const d of R.drops) {
    d.y += d.v * dt; d.x -= d.v * .18 * dt;
    if (d.y > R.h) { d.y = -d.l; d.x = rand(0, R.w + 100); }
    rctx.moveTo(d.x, d.y); rctx.lineTo(d.x + d.l * .18, d.y - d.l);
  }
  rctx.stroke();
}
function rainLoop(now) {
  if (!R.on) return;
  const dt = Math.min(.05, (now - R.last) / 1000); R.last = now;
  rainDraw(dt); R.raf = requestAnimationFrame(rainLoop);
}
function rainStart() { cv.hidden = false; rainSize(); R.on = true; R.last = performance.now(); if (RM) rainDraw(0); else R.raf = requestAnimationFrame(rainLoop); }
function rainStop() { R.on = false; cancelAnimationFrame(R.raf); cv.hidden = true; clearScene(); sfx.rainOff(); stopHeart(); }
addEventListener("resize", () => { if (R.on) { rainSize(); if (RM) rainDraw(0); } });

/* ---------- pause menu ---------- */
const pm = $("#pm"), pauseBtn = $("#pauseBtn");
pauseBtn.addEventListener("click", () => { audioInit(); openPause(); });
function openPause() {
  if (!PLAY.on || PAUSED) return;
  PAUSED = true;
  try { if (SND.ctx && SND.ctx.state === "running") SND.ctx.suspend(); } catch (_) {}
  const sv = loadSave(), canRestart = S && S.live && sv && sv.stage === "day" + S.di;
  const where = S && S.live ? `Day ${S.di + 1} · ${clockStr(Math.min(S.M, SPAN))}` : "Story";
  pm.innerHTML = `<div class="pm-panel" role="dialog" aria-modal="true" aria-labelledby="pmT">
    <h2 id="pmT">Paused</h2>
    <p class="pm-sub">${where} · played ${fmtTime(PLAY.ms)}</p>
    <p class="pm-note">The game is stopped. This isn’t Papa resting: his day is frozen until you come back.</p>
    <button type="button" class="btn big" data-pm="resume">Resume</button>
    ${canRestart ? `<button type="button" class="btn line" data-pm="restart">Restart Day ${S.di + 1}</button>` : ""}
    <div class="pm-row"><label for="pmMus">Music</label><input type="range" id="pmMus" min="0" max="100" value="${Math.round(SND.mvol * 100)}"></div>
    <div class="pm-row"><label for="pmVol">Volume</label><input type="range" id="pmVol" min="0" max="100" value="${Math.round(SND.vol * 100)}"><button type="button" class="btn line" data-pm="mute" aria-pressed="${SND.muted}">${SND.muted ? "Unmute" : "Mute"}</button></div>
    <label class="pm-check"><input type="checkbox" id="pmCaps" ${SND.caps ? "checked" : ""}> Show captions for sounds</label>
    <button type="button" class="btn line" data-pm="title">Quit to title</button>
    <p class="pm-note">The game saves automatically at the start of each day. If you quit, you’ll continue from there.</p>
  </div>`;
  pm.hidden = false;
  pm.querySelector('[data-pm="resume"]').focus();
}
function closePause() {
  if (!PAUSED) return;
  PAUSED = false; pm.hidden = true; pm.innerHTML = "";
  try { if (SND.ctx && SND.ctx.state === "suspended") SND.ctx.resume(); } catch (_) {}
  last = performance.now();
}
function quitToTitle() {
  if (G) closeGame();
  closeMenu(); stopAlarm(); rainStop(); musicStop();
  if (S) { S.live = false; S.paused = false; }
  app.classList.remove("dozing");
  titleScreen();
}
pm.addEventListener("click", e => {
  const b = e.target.closest("[data-pm]"); if (!b) return;
  const a = b.dataset.pm;
  if (a === "resume") closePause();
  else if (a === "restart") { const sv = loadSave(); closePause(); resume(sv, true); }
  else if (a === "title") { closePause(); quitToTitle(); }
  else if (a === "mute") { SND.muted = !SND.muted; applyVol(); saveSnd(); b.textContent = SND.muted ? "Unmute" : "Mute"; b.setAttribute("aria-pressed", SND.muted); }
});
pm.addEventListener("input", e => { if (e.target.id === "pmMus") { SND.mvol = +e.target.value / 100; applyMusicVol(); saveSnd(); } if (e.target.id === "pmVol") { SND.vol = +e.target.value / 100; if (SND.vol > 0 && SND.muted) { SND.muted = false; } applyVol(); saveSnd(); } });
pm.addEventListener("change", e => { if (e.target.id === "pmCaps") { SND.caps = e.target.checked; if (!SND.caps) capEl.hidden = true; saveSnd(); } });
addEventListener("keydown", e => { if (e.key === "Escape") { if (PAUSED) closePause(); else if (PLAY.on) openPause(); } });
addEventListener("pointerdown", () => { if (PLAY.on) audioInit(); }, { capture: true });

/* ---------- testing shortcuts: add #day1–#day4 or #help to the link, or press Shift+1–4 ---------- */
function jump(k) {
  if (G) closeGame();
  closeMenu(); rainStop(); stopAlarm(); hide();
  S = fresh(); setPlay(true);
  audioInit();
  if (k === "help") { S.di = 2; S.d = DAYS[2]; buildBoard(); fifth(); return; }
  if (k === "crisis") { S.di = 2; S.d = DAYS[2]; S.offset = SPAN * 3; S.dayLens = [1, 2, 3].map(n => ({ n, len: SPAN })); buildBoard(); musicStart("day"); marcus(); return; }
  const i = Math.max(0, Math.min(3, parseInt(k.replace("day", ""), 10) - 1));
  if (i === 3 && !S.helpers.length) S.helpers = ["sister", "kids", "door"];
  startDay(i);
}
function fromHash() { const h = location.hash.slice(1); if (/^day[1-4]$/.test(h) || h === "help" || h === "crisis") { jump(h); return true; } return false; }
addEventListener("hashchange", fromHash);
addEventListener("keydown", e => { if (e.shiftKey && /^Digit[1-4]$/.test(e.code)) { e.preventDefault(); jump("day" + e.code.slice(5)); } if (e.shiftKey && e.code === "Digit5") { e.preventDefault(); jump("crisis"); } });

/* ---------- boot ---------- */
S = fresh(); S.di = 0; S.d = DAYS[0];
buildBoard(); hud();
if (!fromHash()) titleScreen();
requestAnimationFrame(frame);
})();
</script>
</body>
