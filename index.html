<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="The Fifth Column: a short serious game about caregiving, based on the story of Wei Ming, his mother and his two children.">
<title>Fifth Column</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@400;500&family=Kalam:wght@400;700&display=swap">
<style>
/* Layout: one screen. An HDB flat's wall (colour follows the clock) holds a whiteboard; the dark aluminium ledges carry the HUD; mini-games slide up under the board. */
:root{
  --wall:#c9d3cf;
  --sun:0;
  --board:#fbfcf9; --board-2:#eef1ec; --ghost:#1f2428;
  --frame:#aab2b4; --frame-edge:#7c8589;
  --ledge:#363e42; --ledge-2:#4a5458; --ledge-ink:#eaefed; --ledge-mute:#a8b3b2; --amber:#f2c063;
  --ink:#1f2428; --ink-soft:#59626a; --line:#d6dbd7;
  --blue:#1e4e9a; --green:#2b7748; --orange:#b35c0e; --purple:#7a3db4; --red:#bd3829;
  --blue-t:#dde6f4; --green-t:#dcefe3; --orange-t:#f6e6d5; --ink-t:#e4e7e9; --purple-t:#ece1f7; --red-t:#f8e2de;
  --card:#ffffff; --note:#fff5c4; --scrim:rgba(16,22,27,.62);
  --night:#121a24; --night-2:#1d2836; --night-ink:#e8edf2; --night-mute:#a3b3c3; --night-line:#33445a;
  --f-marker:"Kalam","Segoe Print","Comic Sans MS",cursive;
  --f-ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme: light;
}
[hidden]{display:none!important}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--wall);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;overflow:hidden;transition:background-color 1s linear}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:var(--sun);
  background:repeating-linear-gradient(112deg,transparent 0 46px,rgba(255,246,214,.55) 46px 58px,transparent 58px 70px,rgba(255,246,214,.35) 70px 74px);
  transition:opacity 1s linear}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

#app{position:relative;z-index:1;height:100%;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wb{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--frame);border-radius:8px;padding:7px;
  box-shadow:0 12px 28px rgba(18,28,34,.24),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 var(--frame-edge)}

.top{display:flex;align-items:center;gap:10px 20px;flex-wrap:wrap;background:var(--ledge);color:var(--ledge-ink);padding:9px 14px;border-radius:5px 5px 0 0}
.when{display:flex;align-items:baseline;gap:12px}
.day{font:700 12px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ledge-mute)}
.clock{font:500 28px/1 var(--f-mono);color:var(--amber);font-variant-numeric:tabular-nums;letter-spacing:-.02em;min-width:6.2ch}
.energy{position:relative;flex:1;min-width:180px;display:grid;gap:5px}
.erow{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ledge-mute)}
.erow b{color:var(--ledge-ink);letter-spacing:.02em;text-transform:none;font-size:13px}
.ebar{height:11px;border-radius:6px;background:var(--ledge-2);overflow:hidden}
.ebar.hit{box-shadow:0 0 0 2px var(--red)}
.ebar.gain{box-shadow:0 0 0 2px var(--purple-t)}
.ebar i{display:block;height:100%;width:70%;background:var(--green);border-radius:6px;transition:background-color .4s}

.surface{flex:1;min-height:0;position:relative;overflow:hidden;
  background:linear-gradient(116deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.8) 50%,rgba(255,255,255,0) 62%),var(--board)}
.ghost{position:absolute;right:3%;bottom:5%;font:400 22px/1.25 var(--f-marker);color:var(--ghost);opacity:.055;transform:rotate(-4deg);pointer-events:none;text-align:right}
.cols{position:relative;height:100%;display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));transition:filter .6s}
.col{min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px;padding:12px 9px 10px;border-left:2px solid var(--line)}
.col:first-child{border-left:0}
.col h2{margin:0;font:700 25px/1 var(--f-marker);color:var(--c)}
.col.papa{background:linear-gradient(var(--purple-t),transparent 60%)}
.need{height:6px;border-radius:3px;background:var(--board-2);overflow:hidden}
.need i{display:block;height:100%;background:var(--c);opacity:.65;transition:width .3s}
.list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px 2px 6px}

.card{appearance:none;position:relative;display:grid;gap:3px;text-align:left;cursor:pointer;background:var(--card);
  border:1px solid var(--line);border-radius:4px;padding:8px 9px 11px 20px;
  box-shadow:0 1px 0 rgba(0,0,0,.04),0 3px 8px rgba(28,40,46,.09);animation:pop .22s ease-out;transition:opacity .4s,transform .4s}
.card::before{content:"";position:absolute;left:7px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:inset 0 -1px 0 rgba(0,0,0,.25)}
.card:hover{border-color:var(--c)}
.lbl{font:400 16.5px/1.18 var(--f-marker)}
.meta{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--ink-soft)}
.mtag{font:700 10px/1.4 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.fuse{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--board-2);border-radius:0 0 4px 4px;overflow:hidden}
.fuse i{display:block;height:100%;width:100%;background:var(--c)}
.card.urgent .fuse i{background:var(--red)}
.card.urgent{border-color:var(--red)}
.card.busy{background:linear-gradient(90deg,var(--t) calc(var(--p,0)*100%),var(--card) 0);border-color:var(--c);cursor:default}
.card.done .lbl{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--c)}
.card.missed .lbl{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--red);color:var(--ink-soft)}
.card.helped{border:1.5px dashed var(--purple);background:var(--purple-t);cursor:default}
.card.missed{order:5;padding:5px 8px 6px 20px;background:var(--red-t);border-color:var(--red);box-shadow:none;cursor:default;animation:pop .25s ease-out}
.card.missed::before{background:var(--red)}
.card.missed .meta,.card.missed .fuse{display:none}
.card.missed .lbl{font-size:14px}
.card.missed::after{content:"✕";position:absolute;right:7px;top:3px;font:700 18px/1 var(--f-marker);color:var(--red)}
.card.helped .who{font:700 12px/1.2 var(--f-ui);color:var(--purple)}
.card.out{opacity:0;transform:translateX(10px) scale(.97)}

.toasts{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:min(92%,460px);pointer-events:none;z-index:3}
.toast{background:var(--note);color:var(--ink);font:400 17px/1.25 var(--f-marker);padding:7px 13px;border-radius:3px;box-shadow:0 4px 12px rgba(30,30,10,.18);transform:rotate(-.8deg);animation:toastIn .25s ease-out;transition:opacity .5s}
.toast.p{background:var(--purple-t);color:var(--purple)}
.toast.fade{opacity:0}

.surface::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(20,26,30,0) 100%);transition:background .8s;z-index:2}
#app.tired .surface::after{background:radial-gradient(ellipse at center,transparent 50%,rgba(20,26,30,.18) 100%)}
#app.exhausted .surface::after{background:radial-gradient(ellipse at center,transparent 38%,rgba(20,26,30,.34) 100%)}
#app.tired .cols{filter:blur(.35px)}
#app.exhausted .cols{filter:blur(.8px);animation:sway 4s ease-in-out infinite}
.zzz{position:absolute;inset:0;border-radius:8px;display:grid;place-items:center;font:700 44px/1 var(--f-marker);color:var(--board);background:rgba(18,24,30,.72);opacity:0;pointer-events:none;transition:opacity .5s;z-index:8;letter-spacing:.2em}
#app.dozing .zzz{opacity:1;pointer-events:auto}

/* mini-game panel */
.game{flex:0 0 auto;height:clamp(260px,47vh,380px);display:flex;flex-direction:column;gap:8px;background:var(--board);border-top:3px solid var(--c);padding:10px 12px 12px;animation:slideUp .25s ease-out}
.g-head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.g-head>div{min-width:0}
.g-col{font:700 11px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
.g-title{margin:3px 0 0;font:700 21px/1.1 var(--f-marker)}
.g-how{margin:3px 0 0;font-size:13.5px;line-height:1.35;color:var(--ink-soft)}
.g-leave{appearance:none;flex:none;background:transparent;border:1.5px solid var(--line);border-radius:6px;padding:8px 10px;font:700 12.5px/1 var(--f-ui);color:var(--ink-soft);cursor:pointer}
.g-leave:hover{border-color:var(--ink-soft)}
.efloat{position:absolute;right:2px;top:-4px;font:500 15px/1 var(--f-mono);pointer-events:none;animation:efloat 1.3s ease-out forwards}
.efloat.neg{color:#ff9283}.efloat.pos{color:#cdb2f0}
.g-new{display:inline-block;margin-left:8px;vertical-align:1px;font:700 10.5px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--board);background:var(--nc,var(--ink));padding:4px 7px;border-radius:3px;animation:pop .2s}
.menu{height:100%;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;padding:10px;align-content:start}
.mact{appearance:none;display:grid;gap:4px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:7px;padding:10px 12px;cursor:pointer}
.mact strong{font:700 18px/1.15 var(--f-marker)}
.mact span{font-size:12.5px;color:var(--ink-soft);line-height:1.3}
.mact em{font:500 11.5px/1 var(--f-mono);font-style:normal;color:var(--purple)}
.mact:hover:not(:disabled){border-color:var(--purple)}
.mact:disabled{opacity:.45;cursor:default}
.corner-btn{appearance:none;flex:none;border:1.5px solid var(--ledge-mute);background:transparent;color:var(--ledge-ink);border-radius:6px;padding:9px 12px;font:700 13px/1 var(--f-ui);cursor:pointer;transition:border-color .3s,color .3s}
.corner-btn.glow{border-color:var(--amber);color:var(--amber)}
.corner-btn:disabled{opacity:.35;cursor:default}
.g-bar{height:6px;border-radius:3px;background:var(--board-2);overflow:hidden}
.g-bar i{display:block;height:100%;width:0;background:var(--c);transition:width .15s}
.g-stage{flex:1;min-height:0;position:relative;border-radius:6px;overflow:hidden;background:var(--board-2);touch-action:none;user-select:none;-webkit-user-select:none}
.g-cv{display:block;touch-action:none;cursor:crosshair}

/* pills */
.pills{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);grid-template-rows:auto 1fr;gap:8px;padding:10px}
.rx{grid-row:1 / 3;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px;overflow:auto;font-size:13px}
.rx b{font:700 11px/1 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.rx ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.rx li{display:flex;align-items:center;gap:8px;min-width:0}
.rx li .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rx em{margin-left:auto;font-style:normal;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;flex:none}
.loose{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;background:var(--card);border:1.5px dashed var(--line);border-radius:6px;padding:6px;min-height:52px}
.box{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-height:0}
.slot{border:2px solid var(--ink-soft);border-radius:9px;background:var(--card);display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;justify-content:center;padding:22px 4px 4px;position:relative;cursor:pointer;transition:border-color .2s,background-color .2s}
.slot span{position:absolute;top:5px;left:0;right:0;text-align:center;font:700 11px/1 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.slot.bad{border-color:var(--red);background:var(--red-t)}
.slot.good{border-color:var(--green);background:var(--green-t)}
.pill{appearance:none;border:0;background:none;padding:6px;cursor:grab;touch-action:none;border-radius:6px;line-height:0}
.pill.sel{outline:2px dashed var(--ink);outline-offset:1px}
.pill.dragging{position:relative;z-index:5;cursor:grabbing}
.pill:disabled{cursor:default;padding:3px}
.pv{display:inline-block;flex:none;border:1px solid rgba(0,0,0,.2);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15),0 1px 2px rgba(0,0,0,.2)}
.pv.round{width:24px;height:24px;border-radius:50%}
.pv.oval{width:34px;height:19px;border-radius:10px}
.pv.tab{width:26px;height:22px;border-radius:5px}
.pv.cap{width:36px;height:16px;border-radius:8px;background-image:linear-gradient(90deg,transparent 50%,rgba(255,255,255,.85) 50%)}

/* find */
.find{position:absolute;inset:0}
.item{appearance:none;position:absolute;width:var(--s);height:var(--s);padding:0;border:0;background:none;cursor:pointer;transform:translate(-50%,-50%) rotate(var(--r));transition:transform .3s,opacity .3s}
.item svg{width:100%;height:100%;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.28))}
.item.paper{width:auto;height:auto;max-width:118px;background:#ffffff;border:1px solid #c6cbc5;border-radius:2px;padding:7px 9px;font:400 14px/1.1 var(--f-marker);color:var(--ink);box-shadow:0 2px 4px rgba(0,0,0,.14);text-align:left}
.item.got{transform:translate(-50%,-50%) rotate(var(--r)) scale(1.35);opacity:0;pointer-events:none}
.item.no{animation:ishake .3s}
.targets{position:absolute;left:8px;right:8px;top:8px;z-index:3;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.targets span{background:var(--card);border:1.5px solid var(--c);border-radius:4px;padding:3px 8px;font:700 12px/1.2 var(--f-ui);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.targets span.ok{text-decoration:line-through;opacity:.45}

/* quiz */
.quiz{height:100%;display:grid;align-content:center;gap:12px;padding:12px}
.quiz p{margin:0;font-size:14px;color:var(--ink-soft);text-align:center}
.qopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.qopt{appearance:none;background:var(--card);border:1.5px solid var(--line);border-radius:7px;padding:18px 6px;font:400 22px/1.1 var(--f-marker);cursor:pointer;overflow-wrap:anywhere}
.qopt:hover{border-color:var(--c)}
.qopt.right{border-color:var(--green);background:var(--green-t)}
.qopt.no{animation:shake .3s;border-color:var(--red)}
.quiz.blurred .qopt{filter:blur(.6px)}

/* timing */
.tim{height:100%;display:grid;align-content:center;gap:12px;padding:14px}
.t-line{margin:0;font:400 19px/1.2 var(--f-marker);text-align:center}
.t-track{position:relative;height:46px;background:var(--card);border:2px solid var(--line);border-radius:23px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.t-zone{position:absolute;top:0;bottom:0;background:var(--t);border-left:2px solid var(--c);border-right:2px solid var(--c);display:grid;place-items:center;font:700 10.5px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--c);transition:left .25s,width .25s;overflow:hidden;white-space:nowrap}
.t-mark{position:absolute;top:5px;bottom:5px;width:6px;margin-left:-3px;border-radius:3px;background:var(--ink)}
.t-track.ok{border-color:var(--green)}
.t-track.no{border-color:var(--red)}
.t-pips{display:flex;justify-content:center;gap:8px}
.t-pips i{width:13px;height:13px;border-radius:50%;border:2px solid var(--c)}
.t-pips i.on{background:var(--c)}

/* papa column */
.calm{height:100%;position:relative;display:grid;justify-items:center;align-content:center;gap:12px;padding:14px;text-align:center}
.calm p{margin:0;font:400 20px/1.25 var(--f-marker)}
.calm.sleep{background:#1b2430;color:#e8edf2}
.sl-count{font:500 56px/1 var(--f-mono);color:var(--amber)}
.notif{position:absolute;right:10px;max-width:min(78%,300px);background:#ffffff;color:var(--ink);border-radius:9px;padding:7px 8px 7px 11px;font-size:13px;line-height:1.3;text-align:left;box-shadow:0 4px 12px rgba(0,0,0,.35);display:flex;gap:8px;align-items:center;animation:pop .2s}
.notif button{appearance:none;flex:none;border:0;background:var(--blue);color:#ffffff;border-radius:5px;padding:6px 9px;font:700 12px/1 var(--f-ui);cursor:pointer}
.bites{display:flex;gap:6px}
.bites i{width:12px;height:12px;border-radius:50%;border:2px solid var(--purple)}
.bites i.on{background:var(--purple)}

/* bottom ledge */
.bottom{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;background:var(--ledge);color:var(--ledge-ink);padding:9px 14px;border-radius:0 0 5px 5px;min-height:48px}
.doing{flex:1;min-width:200px;display:grid;gap:5px}
.drow{display:flex;gap:8px;align-items:baseline;min-width:0}
.lbl-sm{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ledge-mute);flex:none}
#doing{font:400 17px/1.1 var(--f-marker);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dbar{height:5px;border-radius:3px;background:var(--ledge-2);overflow:hidden}
.dbar i{display:block;height:100%;width:0;background:var(--amber)}
.slow{font:700 11px/1 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--amber);border:1px solid var(--amber);border-radius:4px;padding:5px 7px}
.tray{display:flex;gap:6px;align-items:center}
.tray i{display:block;width:30px;height:9px;border-radius:2px 5px 5px 2px;background:var(--c);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.tray i.eraser{width:36px;height:13px;border-radius:3px;background:linear-gradient(var(--board-2) 55%,var(--ink-soft) 55%)}

/* overlay + scenes */
#ov{position:fixed;inset:0;z-index:20;display:flex;overflow-y:auto;background:var(--scrim);
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#ov.clear{background:transparent}
#ov.dark{background:var(--night)}
.panel{margin:auto;width:100%;max-width:640px;background:var(--board);color:var(--ink);border:7px solid var(--frame);border-radius:9px;
  padding:26px 26px 24px;box-shadow:0 18px 50px rgba(0,0,0,.3);display:grid;gap:14px;animation:rise .3s ease-out}
.panel.night{background:rgba(18,26,36,.9);color:var(--night-ink);border-color:var(--night-line)}
.panel.wide{max-width:800px}
.panel.bubble{max-width:540px}
.eyebrow{margin:0;font:700 12px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.night .eyebrow{color:var(--night-mute)}
.scene-line{margin:0;font:400 24px/1.3 var(--f-marker);text-wrap:balance}
.scene-sub{margin:0;font-size:16px;line-height:1.5;color:var(--ink-soft);max-width:60ch}
.night .scene-sub{color:var(--night-mute)}
.big-clock{margin:0;font:500 64px/1 var(--f-mono);color:var(--amber);letter-spacing:-.03em}
.say{margin:0;font:700 26px/1.25 var(--f-marker);color:var(--c,var(--ink))}
.night .say{color:var(--night-ink)}
.shout{margin:0;font:700 30px/1.2 var(--f-marker);color:var(--red)}
.speaker{display:inline-block;justify-self:start;font:700 11px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--board);background:var(--c,var(--ink));padding:5px 8px;border-radius:3px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:4px}
.btn{appearance:none;border:0;cursor:pointer;background:var(--ink);color:var(--board);font:700 15px/1 var(--f-ui);padding:13px 18px;border-radius:6px;letter-spacing:.01em}
.btn:hover{filter:brightness(1.15)}
.btn.purple{background:var(--purple);color:var(--board)}
.night .btn{background:var(--night-ink);color:var(--night)}
.btn.big{font-size:18px;padding:18px 22px;width:100%;max-width:420px}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.choices{display:grid;gap:9px}
.choice{appearance:none;display:grid;gap:3px;width:100%;text-align:left;cursor:pointer;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:7px;padding:11px 14px;font:400 19px/1.3 var(--f-marker)}
.choice:hover:not(:disabled){border-color:var(--ink)}
.choice small{font:400 12.5px/1.3 var(--f-ui);color:var(--red)}
.choice:disabled{opacity:.45;cursor:default}
.night .choice{background:var(--night-2);color:var(--night-ink);border-color:var(--night-line)}
.night .choice:hover:not(:disabled){border-color:var(--night-ink)}
.outcome{margin:0;font:400 20px/1.35 var(--f-marker)}
.delta{justify-self:start;font:500 13px/1 var(--f-mono);padding:5px 8px;border-radius:4px;background:var(--board-2);color:var(--ink-soft)}
.how{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.how li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;font-size:15.5px}
.how li::before{content:"";width:12px;height:12px;margin-top:5px;border-radius:50%;background:var(--c,var(--ink))}
.stats{display:flex;gap:18px;flex-wrap:wrap;font:500 14px/1 var(--f-mono);color:var(--night-mute)}
.stats b{color:var(--night-ink);font-weight:500}

.mini{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));background:var(--board);border:6px solid var(--frame);border-radius:6px;min-height:170px}
.mini>div{min-width:0;padding:9px 8px;border-left:2px solid var(--line)}
.mini>div:first-child{border-left:0}
.mini h3{margin:0 0 6px;font:700 20px/1 var(--f-marker);color:var(--c)}
.mini ul{list-style:none;margin:0;padding:0;display:grid;gap:3px;font:400 15px/1.2 var(--f-marker);color:var(--c)}
.mini ul.faint{opacity:.55}
.mini .papa h3,.mini .papa li{color:var(--purple)}
.mini .papa li{font-size:17px}
.write{display:inline-block;clip-path:inset(0 100% 0 0);animation:write .9s ease-out forwards;animation-delay:var(--d,0s)}
.fade-in{opacity:0;animation:fadeIn .6s ease-out forwards;animation-delay:var(--d,0s)}

.track{height:10px;border-radius:5px;background:var(--night-2);overflow:hidden;border:1px solid var(--night-line)}
.track i{display:block;height:100%;width:0;background:var(--night-ink);transition:width .12s}
.ma-zone{position:relative;height:40px}
.ma{position:absolute;bottom:0;font:700 22px/1 var(--f-marker);color:var(--night-ink);animation:maUp .9s ease-out forwards;pointer-events:none}
.hint{margin:0;font-size:13px;color:var(--night-mute)}

.helpers{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.hcard{appearance:none;cursor:pointer;display:grid;gap:4px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:7px;padding:10px 12px}
.hcard strong{font:700 19px/1.1 var(--f-marker)}
.hcard span{font-size:13px;color:var(--ink-soft);line-height:1.3}
.hcard:hover:not(:disabled){border-color:var(--purple)}
.hcard.sel{border-color:var(--purple)}
.hcard.on{border-color:var(--purple);background:var(--purple-t)}
.hcard.on strong::after{content:" ✓";color:var(--purple)}
.hcard:disabled{cursor:default}
.hcard:disabled:not(.on){opacity:.4}
.count{font:500 13px/1 var(--f-mono);color:var(--purple)}
.chat{display:flex;flex-direction:column;gap:8px;background:var(--board-2);border-radius:7px;padding:12px;min-height:160px}
.chat .ph{margin:auto;color:var(--ink-soft);font-size:14px}
.msg{max-width:86%;padding:8px 12px;border-radius:11px;font-size:15px;line-height:1.35;animation:pop .2s ease-out}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--board);border-bottom-right-radius:3px}
.msg.me.draft{background:var(--card);color:var(--ink-soft);border:1.5px dashed var(--ink-soft)}
.msg.them{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:3px}
.msg .from{display:block;font:700 11px/1.2 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--purple);margin-bottom:2px}
.thought{align-self:flex-end;font:400 16px/1.2 var(--f-marker);color:var(--ink-soft)}
.react{align-self:flex-start;font:400 19px/1.2 var(--f-marker);color:var(--purple)}
.dots{align-self:flex-start;display:flex;gap:4px;padding:10px 12px;background:var(--card);border-radius:11px;border:1px solid var(--line)}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--ink-soft);animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.plist{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.plist li{font:400 19px/1.25 var(--f-marker);color:var(--purple)}
.plist li span{font:400 13.5px/1.3 var(--f-ui);color:var(--ink-soft);display:block}

.note{background:var(--board);border:6px solid var(--frame);border-radius:6px;padding:14px 18px 16px;display:grid;gap:2px}
.note h3{margin:0 0 4px;font:700 32px/1 var(--f-marker);color:var(--purple)}
.note p{margin:0;font:400 22px/1.35 var(--f-marker);color:var(--purple)}
.note .sig{justify-self:end;font-size:19px}
.sec-h{margin:6px 0 0;font:700 13px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.graph{overflow-x:auto}
.graph svg{display:block;width:100%;min-width:520px;height:auto}
.g-band{fill:var(--board-2)}
.g-grid{stroke:var(--line);stroke-width:1}
.g-lab{fill:var(--ink-soft);font:12px var(--f-ui)}
.g-line{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.g-line.d4{stroke:var(--purple)}
.g-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s ease-out .3s forwards}
.g-crisis{stroke:var(--red);stroke-width:1.5;stroke-dasharray:4 4}
.g-red{fill:var(--red);font:700 12px var(--f-ui)}
.g-pur{fill:var(--purple);font:700 12px var(--f-ui)}
.g-z{fill:var(--red);font:700 14px var(--f-marker)}
.inv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:center}
.inv .n{font:500 58px/1 var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums}
.inv p{margin:0;font-size:16px}
.invlist{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 18px}
.invlist li{font:400 17px/1.3 var(--f-marker);display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:2px}
.invlist li b{font:500 13px/1.6 var(--f-mono);color:var(--ink-soft);font-weight:500}
.question{margin:4px 0 0;font:700 27px/1.25 var(--f-marker);text-wrap:balance;color:var(--ink)}

#rain{position:fixed;inset:0;width:100%;height:100%;z-index:15;display:block}

/* title screen */
.title-panel{max-width:720px}
.title-art{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:4px}
.title-h{margin:0;font:700 clamp(42px,9vw,72px)/.95 var(--f-marker);color:var(--ink);letter-spacing:-.01em}
.title-sub{margin:0;font-size:16.5px;line-height:1.45;color:var(--ink-soft);max-width:52ch}
.mini.title-mini{min-height:96px}
.mini .ghostcol{border:2px dashed var(--purple);border-radius:3px;opacity:.55}
.load{display:grid;gap:6px}
.load-bar{height:8px;border-radius:4px;background:var(--board-2);overflow:hidden}
.load-bar i{display:block;height:100%;width:0;background:var(--purple);transition:width .3s}
.load span{font:500 12.5px/1 var(--f-mono);color:var(--ink-soft)}
.cnote{margin:0;font-size:13.5px;line-height:1.4;color:var(--ink-soft);border-left:3px solid var(--line);padding-left:10px}
/* story */
.story-art{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:4px}
.story-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:4px}
.story-foot .actions{margin-top:0}
.story-n{font:500 12.5px/1 var(--f-mono);color:var(--night-mute)}
.panel:not(.night) .story-n{color:var(--ink-soft)}
.btn.btn-ghost{background:transparent;color:inherit;border:1.5px solid currentColor;opacity:.75}
.night .btn.btn-ghost{background:transparent;color:var(--night-ink)}
.ring{display:inline-block;animation:ring .5s ease-in-out infinite}
@keyframes ring{0%,100%{transform:rotate(0)}25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}
/* full-screen title and story */
#ov.full{padding:0;background:#0d1218}
.fs{position:relative;flex:1 1 auto;min-height:100%;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;color:#f5f2ea;animation:fsIn .5s ease-out both}
.fs-bg,.fs-blur{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;object-position:center}
.fs-blur{display:none;filter:blur(22px) brightness(.5);transform:scale(1.15)}
.fs::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(to top,rgba(9,13,19,.94) 0%,rgba(9,13,19,.78) 24%,rgba(9,13,19,.2) 52%,rgba(9,13,19,0) 66%)}
.fs-cap{position:relative;z-index:2;display:grid;gap:10px;width:100%;max-width:800px;
  padding:28px max(24px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
.fs-cap .eyebrow{color:var(--amber)}
.fs-cap .scene-line{color:#f8f5ee;text-shadow:0 1px 3px rgba(0,0,0,.65)}
.fs-cap .scene-sub{color:rgba(242,238,229,.9);text-shadow:0 1px 2px rgba(0,0,0,.6)}
.fs-cap .story-n{color:rgba(242,238,229,.7)}
.fs .btn{background:#f5f2ea;color:#1f2428}
.fs .btn.btn-ghost{background:transparent;color:#f5f2ea}
.title-fs .fs-cap{gap:18px}
.title-fs .title-h{color:#fffdf7;font-size:clamp(50px,10vw,108px);text-shadow:0 2px 0 rgba(0,0,0,.25),0 4px 22px rgba(0,0,0,.6)}
.title-fs .btn.big{max-width:320px}
@keyframes fsIn{from{opacity:0}to{opacity:1}}
@media (max-aspect-ratio:5/4){
  .fs-bg{object-fit:contain;object-position:center 18%}
  .fs-blur{display:block}
  .fs::after{background:linear-gradient(to top,rgba(9,13,19,.95) 0%,rgba(9,13,19,.85) 40%,rgba(9,13,19,0) 62%)}
}
/* steady */
.steady{height:100%;display:grid;align-content:center;gap:12px;padding:14px}
.st-path{display:flex;align-items:center;gap:10px;font:400 16px/1 var(--f-marker);min-width:0}
.st-path span{flex:none}
.st-line{position:relative;flex:1;min-width:40px;height:4px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--ink-soft) 0 8px,transparent 8px 14px);opacity:.6}
.st-walker{position:absolute;top:50%;left:0;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--c)}
.st-bal{position:relative;height:40px;background:var(--red-t);border:2px solid var(--line);border-radius:20px;overflow:hidden}
.st-safe{position:absolute;top:0;bottom:0;background:var(--green-t);border-left:2px solid var(--green);border-right:2px solid var(--green)}
.st-mark{position:absolute;top:5px;bottom:5px;width:10px;margin-left:-5px;border-radius:5px;background:var(--ink);transition:background-color .15s}
.st-mark.bad{background:var(--red)}
.st-msg{margin:0;text-align:center;font-size:14px;color:var(--ink-soft);min-height:1.4em}
.st-btn{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.st-btn.on{background:var(--c);color:var(--board)}
.panel.has-banner{padding-top:0;overflow:hidden}
/* time skip */
.skipcard{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);z-index:6;width:min(88%,460px);background:var(--ledge);color:var(--ledge-ink);border-radius:10px;padding:16px 20px;display:grid;gap:8px;box-shadow:0 12px 30px rgba(0,0,0,.28);animation:pop .25s ease-out}
.skipcard .sk-img{display:block;width:calc(100% + 40px);max-width:none;margin:-16px -20px 2px;aspect-ratio:16/9;object-fit:cover;border-radius:10px 10px 0 0}
.skipcard{overflow:hidden}
.skipcard .sk-t{font:500 26px/1 var(--f-mono);color:var(--amber);font-variant-numeric:tabular-nums}
.skipcard .sk-t span{color:var(--ledge-mute);font-size:18px;margin:0 8px}
.skipcard p{margin:0;font:400 17px/1.35 var(--f-marker)}
.skipcard small{font-size:12.5px;color:var(--ledge-mute)}
.skipcard.out{opacity:0;transition:opacity .35s}
/* story moments */
.panel.beat{max-width:600px}
.beat-text{margin:0;font:400 21px/1.4 var(--f-marker);color:var(--ink)}
.beat-thought{margin:0;justify-self:start;font:italic 400 16px/1.45 var(--f-ui);color:var(--ink-soft);background:var(--board-2);border:1.5px dashed var(--line);border-radius:14px;padding:8px 12px}
/* interruption banners */
.panel.bubble.has-banner{max-width:640px;padding-top:0;overflow:hidden}
.ev-banner{display:block;width:calc(100% + 52px);max-width:none;margin:0 -26px 2px;aspect-ratio:2/1;object-fit:cover;object-position:center 40%}
@media (max-width:700px){.ev-banner{width:calc(100% + 36px);margin:0 -18px 2px}}
/* pause, captions */
.top{padding-right:64px}
.pause-btn{position:fixed;z-index:35;top:max(10px,env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.85);background:rgba(31,36,40,.85);color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.pause-btn::before{content:"";width:13px;height:15px;border-left:4px solid currentColor;border-right:4px solid currentColor;box-sizing:border-box}
#pm{position:fixed;inset:0;z-index:40;display:flex;overflow-y:auto;background:rgba(10,14,20,.74);padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pm-panel{margin:auto;width:100%;max-width:430px;background:var(--board);color:var(--ink);border:7px solid var(--frame);border-radius:9px;padding:22px;display:grid;gap:12px;animation:rise .25s ease-out}
.pm-panel h2{margin:0;font:700 36px/1 var(--f-marker)}
.pm-sub{margin:0;font:500 13px/1.4 var(--f-mono);color:var(--ink-soft)}
.pm-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pm-row label{font-weight:700;font-size:14px}
.pm-row input[type=range]{flex:1;min-width:120px;accent-color:var(--purple)}
.pm-check{display:flex;gap:8px;align-items:center;font-size:14px}
.pm-note{margin:0;font-size:13px;line-height:1.4;color:var(--ink-soft)}
.btn.line{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.line:hover{border-color:var(--ink-soft);filter:none}
.sndcap{position:fixed;z-index:36;top:max(14px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:rgba(16,20,26,.88);color:#f2efe8;font:500 13px/1 var(--f-mono);padding:8px 12px;border-radius:5px;pointer-events:none;max-width:calc(100% - 130px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* speech, memories, consequences, recovery */
.sayl{display:block;overflow:hidden;font:400 13.5px/1.2 var(--f-marker);color:var(--c);background:var(--t);border-radius:8px 8px 8px 2px;padding:3px 7px;margin:-2px 0 2px;animation:sayOut 7s ease-in forwards}
@keyframes sayOut{0%,82%{opacity:1;max-height:60px}100%{opacity:0;max-height:0;padding:0;margin:0}}
.toast.c{background:#ffe9c9;color:#5a3a06;border-left:4px solid var(--orange);font-size:16px}
.toast.m{background:#f4eee3;color:#56452f;font-style:italic;border-left:4px solid #b59a72;font-size:16px}
.card.missed.madeup{background:var(--green-t);border-color:var(--green)}
.card.missed.madeup::before{background:var(--green)}
.card.missed.madeup::after{content:"✓";color:var(--green)}
.card.missed.madeup .lbl{text-decoration-color:var(--green)}
.hand{appearance:none;margin-top:-7px;border:1.5px dashed var(--purple);border-top:0;background:var(--purple-t);color:var(--purple);font:700 12px/1.2 var(--f-ui);padding:7px 9px 6px;border-radius:0 0 5px 5px;cursor:pointer;text-align:left}
.hand:hover{background:#e2d2f4}
.helpdock{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hchip{font:400 12.5px/1.15 var(--f-ui);background:var(--ledge-2);border-left:3px solid #c7a5ee;border-radius:4px;padding:5px 8px;color:var(--ledge-ink)}
.hchip b{font-weight:700}
.hchip.off{opacity:.55}
/* mini-game extras */
.g-say{position:absolute;top:8px;right:8px;z-index:4;max-width:min(70%,330px);background:#ffffff;color:var(--ink);border:1.5px solid var(--c);border-radius:12px 12px 2px 12px;padding:6px 10px;font:400 15px/1.25 var(--f-marker);box-shadow:0 3px 8px rgba(0,0,0,.12);animation:pop .2s,gsayOut .6s ease-in 3.2s forwards;pointer-events:none}
@keyframes gsayOut{to{opacity:0}}
.g-demo{position:absolute;inset:0;z-index:5;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px 18px;align-content:center;align-items:center;padding:16px 20px;background:rgba(251,252,249,.97)}
.g-demo p{margin:0;font-size:15px;line-height:1.45;max-width:50ch}
.g-demo p b{display:block;font:700 21px/1.2 var(--f-marker);color:var(--c);margin-bottom:3px}
.g-demo .btn{grid-column:2;justify-self:start}
.demo-art{grid-row:1 / 3;position:relative;width:96px;height:96px;border-radius:12px;background:var(--board-2);border:2px dashed var(--line)}
.demo-dot{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--c);opacity:.85}
.demo-circle .demo-dot{animation:dCircle 1.6s linear infinite}
@keyframes dCircle{from{transform:rotate(0deg) translateX(26px) rotate(0deg)}to{transform:rotate(360deg) translateX(26px) rotate(-360deg)}}
.demo-swipe .demo-dot{animation:dSwipe 1s ease-in-out infinite alternate}
@keyframes dSwipe{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
.demo-down .demo-dot{animation:dDown 1.1s ease-in infinite}
@keyframes dDown{0%{transform:translateY(-32px);opacity:0}20%{opacity:.85}100%{transform:translateY(32px);opacity:0}}
.demo-tap .demo-dot{animation:dTap 1s ease-in-out infinite}
@keyframes dTap{0%,100%{transform:scale(1)}50%{transform:scale(.55)}}
.demo-hold .demo-dot{animation:dHold 2.2s ease-in-out infinite}
@keyframes dHold{0%,10%{transform:scale(1)}20%,70%{transform:scale(.6)}80%,100%{transform:scale(1)}}
.demo-drag .demo-dot{animation:dDrag 1.6s ease-in-out infinite}
@keyframes dDrag{0%{transform:translate(-26px,-22px)}60%,100%{transform:translate(24px,22px)}}
.demo-wave .demo-dot{animation:dWave 1.8s ease-in-out infinite}
@keyframes dWave{0%{transform:translate(-30px,6px)}25%{transform:translate(-12px,-14px)}50%{transform:translate(4px,8px)}75%{transform:translate(18px,-12px)}100%{transform:translate(32px,4px)}}
/* simmer */
.simmer{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:12px;padding:10px;align-items:center}
.sm-pot{height:100%;min-height:150px;min-width:0}
.sm-ctrl{display:grid;gap:10px;min-width:0}
.sm-gauge{position:relative;height:30px;border-radius:15px;background:linear-gradient(90deg,#cfe0ef,#f6e2c8 50%,#f3b9a8);border:2px solid var(--line);overflow:hidden}
.sm-zone{position:absolute;top:0;bottom:0;background:rgba(43,119,72,.3);border-left:2px solid var(--green);border-right:2px solid var(--green)}
.sm-mark{position:absolute;top:3px;bottom:3px;width:8px;margin-left:-4px;border-radius:4px;background:var(--ink)}
.sm-labels{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);margin-top:3px}
.sm-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sm-btns .btn{padding:14px 8px}
.sm-msg{margin:0;font-size:14px;color:var(--ink-soft);min-height:1.3em}
.sm-msg.hot{color:var(--red);font-weight:700}
/* pack */
.pack{height:100%;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.6fr);gap:10px;padding:10px}
.tt{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13.5px;overflow:auto;min-width:0}
.tt b{display:block;font:700 11px/1.2 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px}
.tt ul{margin:0;padding-left:16px;display:grid;gap:2px}
.tt .bag{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px;min-height:28px;border-top:1px dashed var(--line);padding-top:6px}
.tt .bag span{font-size:12px;background:var(--green-t);color:var(--green);border-radius:3px;padding:2px 6px;font-weight:700}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;align-content:start;overflow:auto;min-width:0}
.pitem{appearance:none;display:grid;justify-items:center;gap:2px;background:var(--card);border:1.5px solid var(--line);border-radius:6px;padding:6px 4px;cursor:pointer;font-size:11.5px;line-height:1.15;text-align:center;color:var(--ink)}
.pitem svg{width:34px;height:34px}
.pitem:hover{border-color:var(--c)}
.pitem.in{opacity:.25;pointer-events:none}
.pitem.no{animation:shake .3s;border-color:var(--red)}
/* phone menu */
.ivr{height:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:10px;align-items:stretch}
.ivr-l{display:grid;gap:8px;align-content:start;min-width:0;overflow:auto}
.ivr-goal{margin:0;font-size:13px;line-height:1.35;background:var(--note);border-radius:4px;padding:6px 9px}
.ivr-who{font:700 11px/1 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.ivr-say{margin:0;font-size:15px;line-height:1.45;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-height:5.2em}
.ivr-say.err{border-color:var(--red);background:var(--red-t)}
.ivr-say.end{border-color:var(--green);background:var(--green-t)}
.keypad{display:grid;grid-template-columns:repeat(3,46px);grid-auto-rows:40px;gap:6px;align-content:center;background:#2c3236;padding:10px;border-radius:14px}
.key{appearance:none;border:0;border-radius:8px;background:#495258;color:#ffffff;font:500 17px/1 var(--f-mono);cursor:pointer}
.key:hover{background:#5b656c}
.key:active{background:var(--c)}
/* talk */
.talk{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;padding:10px}
.talk-top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.talk-set{margin:0;font-size:12.5px;color:var(--ink-soft)}
.calm-m{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft)}
.calm-m i{width:90px;height:6px;border-radius:3px;background:var(--board-2);overflow:hidden;position:relative}
.calm-m i b{position:absolute;left:0;top:0;bottom:0;background:var(--blue);transition:width .3s}
.talk-log{display:flex;flex-direction:column;gap:6px;overflow-y:auto;min-height:0}
.talk-log > :first-child{margin-top:auto}
.tb{max-width:84%;padding:7px 11px;border-radius:12px;font-size:14.5px;line-height:1.35;animation:pop .2s}
.tb.ama{align-self:flex-start;background:var(--blue-t);color:#14325f;border-bottom-left-radius:3px;font-family:var(--f-marker);font-size:17px}
.tb.me{align-self:flex-end;background:var(--ink);color:var(--board);border-bottom-right-radius:3px}
.tb.why{align-self:center;max-width:94%;background:var(--red-t);color:#7a2015;font-size:13px;border-radius:6px}
.talk-opts{display:grid;gap:6px}
.topt{appearance:none;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:7px;padding:8px 11px;font-size:14px;line-height:1.3;cursor:pointer;color:var(--ink)}
.topt:hover:not(:disabled){border-color:var(--c)}
.topt:disabled{opacity:.4;cursor:default}
/* inbox */
.mail{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;padding:10px}
.mail-goal{margin:0;font-size:13px;color:var(--ink-soft)}
.mail-list{display:grid;gap:6px;align-content:start;overflow:auto}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 9px;transition:opacity .3s,transform .3s}
.mrow div{min-width:0}
.mrow b{display:block;font-size:12px;color:var(--ink-soft)}
.mrow span{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow button{appearance:none;border:1.5px solid var(--line);background:var(--board);border-radius:5px;padding:7px 9px;font:700 12px/1 var(--f-ui);cursor:pointer;color:var(--ink)}
.mrow button.rp{border-color:var(--ink);background:var(--ink);color:var(--board)}
.mrow.gone{opacity:0;transform:translateX(16px);pointer-events:none}
.mrow.no{animation:shake .3s;border-color:var(--red)}
/* ending */
.say.slow-in{opacity:0;animation:fadeIn 1.4s ease-out 1.6s forwards}
.ways{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.ways div{background:var(--board-2);border-radius:7px;padding:12px 14px}
.ways h4{margin:0 0 6px;font:700 19px/1.2 var(--f-marker);color:var(--purple)}
.ways ul{margin:0;padding-left:18px;display:grid;gap:5px;font-size:14.5px;line-height:1.4}
.conseq{margin:0;padding-left:18px;display:grid;gap:5px;font-size:14.5px;line-height:1.4}
.played{justify-self:start;font:500 14px/1 var(--f-mono);background:var(--board-2);padding:8px 11px;border-radius:5px}
@media (max-width:700px){
  .g-demo{grid-template-columns:1fr;justify-items:start;gap:8px;padding:12px}
  .demo-art{grid-row:auto;width:60px;height:60px}
  .g-demo .btn{grid-column:auto}
  .simmer{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:6px;padding:6px}
  .sm-pot{min-height:80px}
  .pack{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);padding:6px;gap:6px}
  .tt{max-height:92px}
  .ivr{gap:8px;padding:6px}
  .keypad{grid-template-columns:repeat(3,38px);grid-auto-rows:32px;padding:7px;gap:5px}
  .ivr-say{font-size:13.5px;min-height:4em}
  .topt{font-size:13px;padding:7px 9px}
  .tb{font-size:13px}.tb.ama{font-size:15px}
}
@media (prefers-reduced-motion: reduce){ .say.slow-in{opacity:1;animation:none} }
/* closing message */
.closing{display:grid;gap:10px;border-left:4px solid var(--purple);padding:4px 0 4px 16px}
.closing p{margin:0;font-size:17px;line-height:1.5;max-width:62ch}
.closing p.lead{font:700 22px/1.35 var(--f-marker);color:var(--ink)}
.support{display:grid;gap:8px;background:var(--board-2);border-radius:7px;padding:12px 14px}
.support p{margin:0;font-size:14px;color:var(--ink-soft)}
.support ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.support li{display:grid;gap:1px;font-size:14.5px}
.support li b{font-size:15px}
.support .num{font:500 15px/1.3 var(--f-mono);user-select:all;-webkit-user-select:all}
.support a{color:var(--blue)}
/* images */
.portrait{display:block;width:112px;height:112px;object-fit:contain;justify-self:start;margin-bottom:-4px}
#sceneBg{position:fixed;inset:0;z-index:14;background-position:center;background-size:cover;background-repeat:no-repeat;background-color:var(--night)}
#ov.low .panel{margin:auto auto 0}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideUp{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes toastIn{from{transform:translateY(8px) rotate(-.8deg);opacity:0}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes ishake{25%{transform:translate(calc(-50% - 5px),-50%) rotate(var(--r))}75%{transform:translate(calc(-50% + 5px),-50%) rotate(var(--r))}}
@keyframes sway{50%{transform:translateX(1.5px) rotate(.15deg)}}
@keyframes write{to{clip-path:inset(0 0 0 0)}}
@keyframes fadeIn{to{opacity:1}}
@keyframes maUp{from{transform:translateY(0);opacity:1}to{transform:translateY(-34px);opacity:0}}
@keyframes dot{50%{opacity:.25}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes efloat{to{transform:translateY(-18px);opacity:0}}

@media (max-width:700px){
  .col{padding:9px 5px 8px;gap:6px}
  .col h2{font-size:18px}
  .card{padding:6px 6px 9px 15px}
  .card::before{left:5px;top:9px;width:6px;height:6px}
  .lbl{font-size:14px}
  .meta{display:none}
  .clock{font-size:22px}
  .tray{display:none}
  .game{padding:8px 9px 9px;height:clamp(270px,52vh,380px)}
  .g-title{font-size:18px}
  .g-how{font-size:12.5px}
  .pills{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);padding:7px;gap:6px}
  .rx{font-size:12px;padding:6px 7px}
  .panel{padding:20px 18px;border-width:5px}
  .scene-line{font-size:21px}
  .say{font-size:23px}
  .big-clock{font-size:50px}
  .mini h3{font-size:15px}
  .mini ul,.mini .papa li{font-size:13px}
  .inv{grid-template-columns:1fr}
  .qopt{font-size:18px;padding:14px 4px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .write{clip-path:none;animation:none}
  .fade-in{opacity:1;animation:none}
  .g-draw{stroke-dashoffset:0;animation:none}
}
</style>
</head>
<body>
<div id="app">
  <div class="wb">
    <header class="top">
      <div class="when"><span class="day" id="dayLbl">Monday</span><span class="clock" id="clock">5:15 AM</span></div>
      <div class="energy" id="energy"><div class="erow"><span>Papa’s energy</span><b id="eWord">Holding up</b></div><div class="ebar"><i id="eFill"></i></div></div>
    </header>
    <main class="surface" id="surface">
      <div class="ghost" aria-hidden="true">Chloe dentist, Thurs 3pm<br>buy Ma’s ginger — J.</div>
      <div class="cols" id="cols"></div>
      <div class="toasts" id="toasts" aria-live="polite"></div>
    </main>
    <section class="game" id="game" hidden>
      <div class="g-head">
        <div><span class="g-col" id="gCol">Ah Ma</span><span class="g-new" id="gNew" hidden></span><h3 class="g-title" id="gTitle">Task</h3><p class="g-how" id="gHow" aria-live="polite"></p></div>
        <button type="button" class="g-leave" id="gLeave">Leave it for now</button>
      </div>
      <div class="g-bar"><i id="gFill"></i></div>
      <div class="g-stage" id="gStage"></div>
    </section>
    <footer class="bottom">
      <div class="doing"><div class="drow"><span class="lbl-sm">Papa is</span><span id="doing">getting up</span></div><div class="dbar"><i id="dFill"></i></div></div>
      <span class="slow" id="slow" hidden>≈ 10 min</span>
      <button type="button" class="corner-btn" id="cornerBtn" disabled hidden>Papa’s corner</button>
      <div class="helpdock" id="helpdock" hidden></div>
      <div class="tray" aria-hidden="true"><i style="--c:var(--blue)"></i><i style="--c:var(--green)"></i><i style="--c:var(--orange)"></i><i style="--c:var(--ink)"></i><i class="eraser"></i></div>
    </footer>
    <div class="zzz" aria-hidden="true">z z z</div>
  </div>
</div>
<div id="sceneBg" hidden></div>
<canvas id="rain" hidden></canvas>
<div id="ov" hidden></div>
<button type="button" class="pause-btn" id="pauseBtn" aria-label="Pause the game" hidden></button>
<div class="sndcap" id="cap" aria-live="polite" hidden></div>
<div id="pm" hidden></div>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const TAU = Math.PI * 2;
let PAUSED = false;                       // the pause menu (separate from Papa resting in-game)
const PLAY = { ms: 0, on: false };        // total time played, shown at the end
const capEl = $("#cap");

/* ---------- sound: generated in the browser, no files ---------- */
const SND = { ctx: null, master: null, vol: .7, mvol: .45, muted: false, caps: true, nb: null, rain: null, last: {} };
try { const o = JSON.parse(localStorage.getItem("fifth-column-sound") || "{}"); if (typeof o.vol === "number") SND.vol = o.vol; if (typeof o.mvol === "number") SND.mvol = o.mvol; SND.muted = !!o.muted; if (o.caps === false) SND.caps = false; } catch (_) {}
function saveSnd() { try { localStorage.setItem("fifth-column-sound", JSON.stringify({ vol: SND.vol, mvol: SND.mvol, muted: SND.muted, caps: SND.caps })); } catch (_) {} }
function audioInit() {
  try {
    if (!SND.ctx) {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      SND.ctx = new C(); SND.master = SND.ctx.createGain(); SND.master.connect(SND.ctx.destination);
      const len = SND.ctx.sampleRate * 2, b = SND.ctx.createBuffer(1, len, SND.ctx.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      SND.nb = b;
    }
    if (SND.ctx.state === "suspended" && !PAUSED) SND.ctx.resume();
    applyVol();
  } catch (_) {}
}
function applyVol() { if (SND.master) SND.master.gain.value = SND.muted ? 0 : SND.vol; }
const sndOn = () => SND.ctx && SND.ctx.state === "running" && !SND.muted && SND.vol > 0;
function tone(f, dur, type = "sine", vol = .15, when = 0, f2) {
  if (!sndOn()) return;
  try {
    const c = SND.ctx, t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(SND.master); o.start(t); o.stop(t + dur + .05);
  } catch (_) {}
}
function noise(dur, vol = .1, freq = 1000, type = "bandpass", when = 0, q = 1) {
  if (!sndOn()) return;
  try {
    const c = SND.ctx, t = c.currentTime + when, src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = SND.nb; src.loop = true; f.type = type; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    src.connect(f).connect(g).connect(SND.master); src.start(t, Math.random()); src.stop(t + dur + .05);
  } catch (_) {}
}
const every = (k, ms) => { const n = performance.now(); if (n - (SND.last[k] || 0) < ms) return false; SND.last[k] = n; return true; };
function caption(t) { if (!SND.caps) return; capEl.textContent = t; capEl.hidden = false; clearTimeout(caption.t); caption.t = setTimeout(() => { capEl.hidden = true; }, 2400); }
const sfx = {
  tap: () => tone(700, .06, "triangle", .07),
  ok: () => { tone(660, .12, "sine", .12); tone(990, .16, "sine", .1, .08); },
  err: () => { if (every("err", 150)) tone(170, .16, "square", .05); },
  done: () => { tone(523, .1, "sine", .12); tone(659, .1, "sine", .12, .08); tone(784, .22, "sine", .12, .16); },
  miss: () => { tone(392, .18, "triangle", .1); tone(294, .3, "triangle", .1, .16); },
  pop: () => tone(880, .07, "sine", .1, 0, 1500),
  chop: () => { noise(.05, .3, 2500, "bandpass", 0, 2); tone(160, .06, "triangle", .12); },
  scrub: () => { if (every("scrub", 90)) noise(.08, .05, 1400, "bandpass", 0, .8); },
  pen: () => { if (every("pen", 70)) noise(.05, .025, 3500, "bandpass", 0, 3); },
  stir: () => { if (every("stir", 170)) tone(rand(260, 380), .09, "sine", .05, 0, rand(500, 700)); },
  bubble: pr => { if (Math.random() < (pr || .2) && every("bub", 120)) tone(rand(300, 500), .07, "sine", .05, 0, rand(600, 900)); },
  sizzle: () => { if (every("siz", 280)) { noise(.3, .06, 5000, "highpass"); if (every("sizcap", 3000)) caption("[pot boiling over]"); } },
  key: n => { const lo = { 1: 697, 2: 697, 3: 697, 4: 770, 5: 770, 6: 770, 7: 852, 8: 852, 9: 852 }[n] || 941, hi = { 1: 1209, 4: 1209, 7: 1209, 3: 1477, 6: 1477, 9: 1477 }[n] || 1336; tone(lo, .12, "sine", .05); tone(hi, .12, "sine", .05); },
  phone: () => { caption("[phone buzzing]"); for (let k = 0; k < 3; k++) { tone(150, .22, "sawtooth", .035, k * .38); noise(.22, .03, 180, "lowpass", k * .38); } },
  alarm: () => { for (let k = 0; k < 4; k++) tone(1760, .07, "square", .04, k * .14); },
  chime: () => { tone(1046, .5, "sine", .05); tone(1318, .6, "sine", .04, .16); },
  creak: () => { caption("[the gate clicks open]"); tone(320, .5, "sawtooth", .03, 0, 200); tone(900, .04, "square", .04, .5); },
  doze: () => { caption("[Papa nods off]"); tone(330, .7, "sine", .06, 0, 110); },
  heart: () => { tone(62, .14, "sine", .3); tone(55, .16, "sine", .25, .22); },
  rainOn: () => {
    caption("[heavy rain]");
    if (!SND.ctx || SND.rain || !SND.nb) return;
    try { const c = SND.ctx, src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); src.buffer = SND.nb; src.loop = true; f.type = "lowpass"; f.frequency.value = 1400; g.gain.value = .0001; src.connect(f).connect(g).connect(SND.master); src.start(); g.gain.setTargetAtTime(.16, c.currentTime, .5); SND.rain = { src, g }; } catch (_) {}
  },
  rainDuck: v => { if (SND.rain) try { SND.rain.g.gain.setTargetAtTime(v, SND.ctx.currentTime, .6); } catch (_) {} },
  rainOff: () => { if (!SND.rain) return; const { src, g } = SND.rain; SND.rain = null; try { g.gain.setTargetAtTime(.0001, SND.ctx.currentTime, .4); src.stop(SND.ctx.currentTime + 2); } catch (_) {} }
};
/* background music: soft pads and a music-box arpeggio, generated live */
const MUSIC = { on: false, mood: "day", step: 0, next: 0, timer: 0, gain: null };
const PROG = {
  day:  [[53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 60], [48, 52, 55, 59]],
  warm: [[48, 52, 55, 59], [53, 57, 60, 64], [45, 48, 52, 55], [55, 59, 62, 65]]
};
const ARP = [0, 2, 1, 3, 2, 1, 3, -1], BEAT = .78;
const mtof = n => 440 * Math.pow(2, (n - 69) / 12);
function musicGain() { if (!MUSIC.gain && SND.ctx) { MUSIC.gain = SND.ctx.createGain(); MUSIC.gain.gain.value = .0001; MUSIC.gain.connect(SND.master); } return MUSIC.gain; }
function applyMusicVol() { if (MUSIC.gain && SND.ctx) MUSIC.gain.gain.setTargetAtTime(MUSIC.on ? Math.max(.0001, SND.mvol) : .0001, SND.ctx.currentTime, .4); }
function mnote(f, t, dur, type, vol, atk) {
  const c = SND.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(vol, t + atk); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(MUSIC.gain); o.start(t); o.stop(t + dur + .1);
}
function musicTick() {
  if (!MUSIC.on || PAUSED || !SND.ctx || SND.ctx.state !== "running") return;
  const c = SND.ctx;
  if (MUSIC.next < c.currentTime - .1) MUSIC.next = c.currentTime + .05;
  while (MUSIC.next < c.currentTime + .5) {
    const st = MUSIC.step, t = MUSIC.next, ch = PROG[MUSIC.mood][Math.floor(st / 8) % 4];
    try {
      if (st % 8 === 0) {
        ch.forEach(n => { mnote(mtof(n), t, BEAT * 8.4, "sine", .022, 1.4); mnote(mtof(n) * 1.003, t, BEAT * 8.4, "triangle", .008, 1.6); });
        mnote(mtof(ch[0] - 12), t, BEAT * 7, "sine", .03, .3);
      }
      const a = ARP[st % 8]; if (a >= 0) mnote(mtof(ch[a] + 12), t, 1.4, "triangle", .028, .01);
    } catch (_) {}
    MUSIC.step++; MUSIC.next += BEAT;
  }
}
function musicStart(mood) {
  if (mood) MUSIC.mood = mood;

/* 1. swipe to clean */
const CLEAN = {
  sheet: { bg: "#dce8f4", line: "#c6d7ea", stain: "158,124,62", how: "Swipe back and forth to scrub the stains out of the sheet.", pat: "stripe" },
  floor: { bg: "#e4e8e5", line: "#cdd3cf", stain: "128,104,70", how: "Swipe to mop the floor clean.", pat: "tile" },
  table: { bg: "#d9c3a0", line: "#ccb38c", stain: "250,244,228", how: "Swipe to wipe the spilled porridge off the table.", pat: "wood" }

function mClean(stage, ctx) {
  const sk = CLEAN[ctx.skin] || CLEAN.sheet; ctx.how(sk.how);
  const { cv, g, w, h } = makeCanvas(stage);
  const CS = 12, C = Math.ceil(w / CS), R = Math.ceil(h / CS), dirt = new Float32Array(C * R);
  const nb = ctx.q ? 2 : 4 + Math.round(ctx.d * 2);
  for (let b = 0; b < nb; b++) {
    const cx = rand(w * .12, w * .88), cy = rand(h * .18, h * .82), rr = ctx.q ? rand(24, 38) : rand(28, 50);
    for (let j = 0; j < R; j++) for (let i = 0; i < C; i++) {
      const dx = i * CS + CS / 2 - cx, dy = j * CS + CS / 2 - cy, q = (dx * dx + dy * dy) / (rr * rr);
      if (q < 1) { const k = j * C + i; dirt[k] = Math.max(dirt[k], Math.min(1, 1 - q * .35 + rand(-.08, .08))); }
    }
  }
  let total = 0; for (const v of dirt) total += v;
  const BR = 26, rate = (1 / (5 * BR)) * (1 - .45 * ctx.d);
  let down = false, lp = null, cur = null;
  function scrub(x, y, L) {
    const i0 = Math.max(0, Math.floor((x - BR) / CS)), i1 = Math.min(C - 1, Math.floor((x + BR) / CS));
    const j0 = Math.max(0, Math.floor((y - BR) / CS)), j1 = Math.min(R - 1, Math.floor((y + BR) / CS));
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      const dx = i * CS + CS / 2 - x, dy = j * CS + CS / 2 - y;
      if (dx * dx + dy * dy < BR * BR) { const k = j * C + i; if (dirt[k] > 0) dirt[k] = Math.max(0, dirt[k] - L * rate); }
    }
  }
  cv.addEventListener("pointerdown", e => { if (ctx.blocked()) return; e.preventDefault(); down = true; try { cv.setPointerCapture(e.pointerId); } catch (_) {} lp = cur = ptr(cv, e); });
  cv.addEventListener("pointermove", e => {
    cur = ptr(cv, e);
    if (!down || ctx.blocked()) { lp = cur; return; }
    const L = Math.hypot(cur.x - lp.x, cur.y - lp.y), steps = Math.max(1, Math.ceil(L / (BR / 2)));
    for (let s = 1; s <= steps; s++) scrub(lp.x + (cur.x - lp.x) * s / steps, lp.y + (cur.y - lp.y) * s / steps, L / steps);
    sfx.scrub();
    lp = cur;
  });
  const up = () => { down = false; };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  cv.addEventListener("pointerleave", () => { if (!down) cur = null; });
  function draw() {
    g.fillStyle = sk.bg; g.fillRect(0, 0, w, h);
    g.strokeStyle = sk.line; g.lineWidth = 2; g.beginPath();
    if (sk.pat === "stripe") for (let x = 14; x < w; x += 30) { g.moveTo(x, 0); g.lineTo(x, h); }
    else if (sk.pat === "tile") { for (let x = 40; x < w; x += 44) { g.moveTo(x, 0); g.lineTo(x, h); } for (let y = 40; y < h; y += 44) { g.moveTo(0, y); g.lineTo(w, y); } }
    else for (let y = 18; y < h; y += 26) { g.moveTo(0, y); g.bezierCurveTo(w * .3, y + 6, w * .6, y - 6, w, y + 3); }
    g.stroke();
    let rem = 0;
    for (let j = 0; j < R; j++) for (let i = 0; i < C; i++) {
      const v = dirt[j * C + i]; if (v <= .03) continue; rem += v;
      g.fillStyle = `rgba(${sk.stain},${(v * .85).toFixed(3)})`;
      g.beginPath(); g.arc(i * CS + CS / 2, j * CS + CS / 2, CS * .85, 0, TAU); g.fill();
    }
    if (cur) { g.fillStyle = "rgba(255,226,120,.35)"; g.strokeStyle = "rgba(31,36,40,.45)"; g.lineWidth = 2; g.beginPath(); g.arc(cur.x, cur.y, BR, 0, TAU); g.fill(); g.stroke(); }
    return rem;
  }
  return { update() { const rem = draw(); ctx.set(Math.min(1, (1 - rem / total) / .94)); } };
}

/* 2. pop the bubbles */
function mBubbles(stage, ctx) {
  ctx.how("Pop the soap bubbles to rinse Ah Ma off. Gently does it.");
  const { cv, g, w, h } = makeCanvas(stage);
  const need = ctx.q ? 5 : 10 + Math.round(ctx.d * 3); let popped = 0, t = 0, sp = 0;
  const B = [], P = [];
  const rmin = 22 - ctx.d * 7, vmin = 40 + ctx.d * 45;
  const add = () => B.push({ x: rand(30, w - 30), y: h + 30, r: rand(rmin, rmin + 12), v: rand(vmin, vmin + 30), ph: rand(0, TAU) });
  for (let i = 0; i < 5; i++) { add(); B[i].y = rand(h * .3, h); }
  cv.addEventListener("pointerdown", e => {
    if (ctx.blocked()) return; e.preventDefault();
    const p = ptr(cv, e);
    for (let i = B.length - 1; i >= 0; i--) { const b = B[i]; if (Math.hypot(p.x - b.x, p.y - b.y) < b.r + 9) { B.splice(i, 1); popped++; sfx.pop(); P.push({ x: b.x, y: b.y, r: b.r, a: 1 }); ctx.set(popped / need); return; } }
  });
  return {
    update(dt) {
      t += dt; sp -= dt;
      if (sp <= 0 && B.length < 9) { add(); sp = .3; }
      for (const b of B) { b.y -= b.v * dt; b.x += Math.sin(b.ph + t * 2.2) * 16 * dt; }
      for (let i = B.length - 1; i >= 0; i--) if (B[i].y < -B[i].r - 6) B.splice(i, 1);
      for (let i = P.length - 1; i >= 0; i--) { P[i].a -= dt * 3; P[i].r += dt * 50; if (P[i].a <= 0) P.splice(i, 1); }
      g.fillStyle = "#e1edf0"; g.fillRect(0, 0, w, h);
      g.strokeStyle = "#cde0e4"; g.lineWidth = 2; g.beginPath();
      for (let x = 34; x < w; x += 36) { g.moveTo(x, 0); g.lineTo(x, h); }
      for (let y = 34; y < h; y += 36) { g.moveTo(0, y); g.lineTo(w, y); }
      g.stroke();
      g.fillStyle = "#9aa6ab"; g.fillRect(w - 70, 10, 46, 10); g.fillRect(w - 30, 0, 6, 16);
      g.strokeStyle = "rgba(120,170,200,.35)"; g.lineWidth = 1.5; g.beginPath();
      for (let k = 0; k < 7; k++) { const x = w - 66 + k * 6; g.moveTo(x, 22); g.lineTo(x - 8, 22 + 40 + (k % 3) * 14); }
      g.stroke();
      for (const b of B) {
        g.fillStyle = "rgba(255,255,255,.5)"; g.strokeStyle = "rgba(110,160,185,.9)"; g.lineWidth = 1.6;
        g.beginPath(); g.arc(b.x, b.y, b.r, 0, TAU); g.fill(); g.stroke();
        g.fillStyle = "rgba(255,255,255,.95)"; g.beginPath(); g.arc(b.x - b.r * .35, b.y - b.r * .35, b.r * .2, 0, TAU); g.fill();
      }
      for (const p of P) { g.strokeStyle = `rgba(110,160,185,${p.a.toFixed(2)})`; g.lineWidth = 2; g.beginPath(); g.arc(p.x, p.y, p.r, 0, TAU); g.stroke(); }
      g.fillStyle = "rgba(31,36,40,.6)"; g.font = "500 13px 'DM Mono', monospace"; g.fillText(`${popped} / ${need}`, 12, h - 12);
    }
  };
}

/* 9. watch the simmering pot */

  stage.appendChild(wrap);
  const { g, w, h } = makeCanvas(wrap.querySelector(".sm-pot"));
  const zone = wrap.querySelector(".sm-zone"), mark = wrap.querySelector(".sm-mark"), msg = wrap.querySelector(".sm-msg");
  zone.style.left = lo * 100 + "%"; zone.style.width = zw * 100 + "%";
  let heat = .3, temp = .25, drift = 0, held = 0, t = 0, over = 0, hit = false, lastMsg = "";
  const say = (m, hot) => { if (m !== lastMsg) { msg.textContent = m; lastMsg = m; msg.classList.toggle("hot", !!hot); } };

  wrap.querySelector(".sm-up").addEventListener("click", () => adj(.12));
  wrap.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft" || e.key === "ArrowDown") { e.preventDefault(); adj(-.12); }
    if (e.key === "ArrowRight" || e.key === "ArrowUp") { e.preventDefault(); adj(.12); }
  });

    g.fillStyle = "#e8e3d6"; g.fillRect(0, 0, w, h);
    const cx = w / 2, pw = Math.min(w * .66, 190), ph = Math.min(h * .4, 92), py = h * .3, base = py + ph + 16;
    g.fillStyle = "#3b4146"; g.fillRect(cx - pw * .7, base, pw * 1.4, 9);
    for (let k = 0; k < 5; k++) {
      const x = cx - pw * .36 + k * pw * .18, fl = 5 + heat * 24 * (.85 + Math.sin(t * 13 + k) * .15);

function setWall(f) {

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (PLAY.on && !PAUSED && !document.hidden) PLAY.ms += dt * 1000;
  if (S && S.live && !S.paused && !PAUSED) tick(dt);
  requestAnimationFrame(frame);
}
function tick(dt) {
  const d = S.d;
  const hasOpen = S.cards.some(c => c.state === "open");
  if (!G && !menuOpen && !skipping && S.dozing <= 0 && S.M < SPAN && !hasOpen) {
    const nx = nextAt();
    if (nx - S.M > 25) { startSkip(nx >= SPAN ? SPAN : nx - 3); return; }
  }
  let dM;
  if (S.dozing > 0) {
    S.dozing -= dt; dM = IDLE_BUSY * dt;
    if (S.dozing <= 0) { S.energy = 15; app.classList.remove("dozing"); }
  } else if (G) dM = updateGame(dt);
  else dM = (hasOpen || menuOpen ? IDLE_BUSY : IDLE_EMPTY) * dt;
  S.M += dM;
  while (S.si < d.ts.length && d.ts[S.si].at <= S.M) spawn(d.ts[S.si++]);
  for (let i = S.pending.length - 1; i >= 0; i--) if (S.pending[i].at <= S.M) { const p = S.pending.splice(i, 1)[0]; spawn(p.task); }
  if (S.ei < d.es.length && d.es[S.ei].at <= S.M && S.dozing <= 0) { fireEvent(d.es[S.ei++].id); hud(); return; }
  for (const c of S.cards.slice()) {
    if (c.state !== "open") continue;
    c.left -= dM;
    if (c.left <= 0) { miss(c); continue; }
    const r = c.left / c.max;
    c.fuseEl.style.width = (r * 100) + "%";
    if (r < .3 && !c.el.classList.contains("urgent")) { c.el.classList.add("urgent"); if (S.di === 0) tip("red", "A red line means it’s about to slip."); }
  }
  if (G) S.energy -= d.drain * dM;
  for (const k of d.cols) { if (k === "papa") continue; S.needs[k] = clamp(S.needs[k] - d.decay * (S.covered.has(k) ? .35 : 1) * dM); }
  if (S.M < SPAN) { S.nextInv -= dM; if (S.nextInv <= 0) { invisible(); S.nextInv = rand(d.inv[0], d.inv[1]); } }
  if (S.energy <= 0 && S.dozing <= 0) { S.energy = 0; if (G) leaveGame(); if (menuOpen) closeMenu(); doze(); }
  S.energy = clamp(S.energy);
  S.logT += dM;
  if (S.logT >= 6) { S.logT = 0; S.log.push({ g: S.offset + Math.min(S.M, SPAN), e: S.energy }); setWall(Math.min(S.M / SPAN, 1)); }
  if (S.M >= SPAN && menuOpen) closeMenu();
  if (S.di === 3) updateHands();
  hud();
  const boardClear = !S.cards.some(c => c.state === "open") && !S.pending.length && S.si >= d.ts.length;
  if (S.M >= SPAN && !G && !menuOpen && S.dozing <= 0 && boardClear) endDay();
}

const SKIP_LINES = {
  work: ["You answered 31 emails and ate lunch at your desk.", "Two meetings. One of them could have been an email.", "Ah Ma called twice to ask where Joan is.", "You read the same paragraph four times.", "The class group chat: 46 new messages about a costume."],

  warm: ["Your sister texted: “Ma ate all her lunch.”", "Nobody called. You finished a whole task without stopping.", "Marcus sent a voice note about his model. You played it twice."]
};
function nextAt() {
  const d = S.d; let n = SPAN;
  if (S.si < d.ts.length) n = Math.min(n, d.ts[S.si].at);
  if (S.ei < d.es.length) n = Math.min(n, d.es[S.ei].at);
  S.pending.forEach(x => { n = Math.min(n, x.at); });
  return n;
}
let skipping = false;
function startSkip(to) {
  skipping = true; S.paused = true;
  const from = S.M, mid = (from + to) / 2, d = S.d;
  const cat = S.di === 3 && from > tm("08:00") ? "warm" : mid < tm("08:30") ? "morning" : mid < tm("17:30") ? "work" : "evening";
  const pool = SKIP_LINES[cat], pic = img("skip-" + cat + (S.di === 3 ? "" : "-" + (S.di + 1))) || img("skip-" + cat);
  const span = Math.max(0, to - from), inv = Math.max(1, Math.round(span / ((d.inv[0] + d.inv[1]) / 2)));
  const el = document.createElement("div"); el.className = "skipcard"; el.setAttribute("role", "status");
  el.innerHTML = `${pic ? `<img class="sk-img" src="${pic}" alt="">` : ""}<div class="sk-t">${clockStr(from)}<span>→</span>${clockStr(Math.min(to, SPAN))}</div><p>${pick(pool)}</p><small>+${inv} small thing${inv === 1 ? "" : "s"} nobody wrote down</small>`;
  $("#surface").appendChild(el);
  tone(520, .25, "sine", .04, 0, 780);
  const owner = S, t0 = performance.now(), dur = RM ? 1900 : 2900;
  (function anim(now) {
    if (S !== owner || !skipping) return;
    const k = Math.min(1, (now - t0) / (dur * .7));
    clockEl.textContent = clockStr(Math.min(SPAN, from + (to - from) * (1 - Math.pow(1 - k, 2))));
    setWall(Math.min((from + (to - from) * k) / SPAN, 1));
    if (k < 1) requestAnimationFrame(anim);
  })(t0);
  const finish = () => {
    if (S !== owner || !S.live) { skipping = false; el.remove(); return; }
    if (PAUSED) { setTimeout(finish, 200); return; }
    for (const k of d.cols) { if (k === "papa") continue; S.needs[k] = clamp(S.needs[k] - d.decay * (S.covered.has(k) ? .35 : 1) * span); }
    for (let i = 0; i < inv; i++) invisible();
    S.nextInv = rand(d.inv[0], d.inv[1]);
    S.M = to; S.log.push({ g: S.offset + Math.min(S.M, SPAN), e: S.energy });
    setWall(Math.min(S.M / SPAN, 1));
    el.classList.add("out"); setTimeout(() => el.remove(), 380);
    skipping = false; S.paused = false; last = performance.now(); hud();
  };
  setTimeout(finish, dur);
}

function startDay(i, fromSave) {

  }

  d.es = d.events.map(e => Object.assign({}, e, { at: tm(e.time) })).sort((a, b) => a.at - b.at);
  S.nextInv = rand(d.inv[0], d.inv[1]);

/* ---------- interruptions ---------- */
function fireEvent(id) {
  let ev = EV[id]; if (typeof ev === "function") ev = ev();
  if (!ev) return;
  if (ev.toast) { toast(ev.toast, ev.e ? "m" : "p", ev.e ? 4600 : 3000); if (ev.e) { S.energy = clamp(S.energy + ev.e); floatE(ev.e); sfx.chime(); } return; }
  ev.id = id; ev.bk = BANNER[id];
  S.paused = true;
  if (["leftout", "filial", "fever", "callwork"].includes(id) || ev.pic === "phone") sfx.phone();
  else if (id === "door4") sfx.creak();
  const c = COLS[ev.who] ? COLS[ev.who].c : "var(--ink)";
  const ch = ev.choices.map((x, i) => {
    const warn = x.k === "gentle" && S.energy < 30 ? `<small>You’re running on empty. This will take more out of you.</small>` : "";
    return `<button class="choice" data-act="c${i}">${x.text}${warn}</button>`;
  }).join("");
  const h = {};
  ev.choices.forEach((x, i) => { h["c" + i] = () => choose(ev, x); });
  const bn = banner(ev);
  if (ev.beat) {
    sfx.chime();
    const many = ev.choices.length > 1;
    const bch = ev.choices.map((x, i) => `<button class="${many ? "choice" : "btn"}" data-act="c${i}">${x.text}</button>`).join("");
    show(`<div class="panel bubble beat${bn ? " has-banner" : ""}">${bn}<p class="eyebrow">${ev.when}</p><p class="beat-text">${ev.text}</p>${ev.thought ? `<p class="beat-thought">${ev.thought}</p>` : ""}<div class="${many ? "choices" : "actions"}">${bch}</div></div>`, "", h);
    return;
  }
  show(`<div class="panel bubble${bn ? " has-banner" : ""}" style="--c:${c}">${bn || portrait(ev.pic, ev.mood0)}<span class="speaker">${ev.speaker}</span><p class="say">${ev.line}</p><div class="choices">${ch}</div></div>`, "", h);
}
function choose(ev, x) {
  let e = (S.di === 3 && x.e4 != null) ? x.e4 : (x.e || 0);
  if (x.k === "gentle" && S.energy < 30 && e < 0) e = Math.round(e * 1.5);
  S.energy = clamp(S.energy + e);
  if (x.need) for (const k in x.need) S.needs[k] = clamp(S.needs[k] + x.need[k]);
  if (x.k) S.k[x.k]++;
  if (x.k === "snap") S.snapDay[S.di] = true;
  if (x.flag) S.flags[x.flag] = true;
  if (x.fish) S.fish = x.fish;
  if (x.add) S.pending.push({ at: S.M + (x.addDelay || 5), task: Object.assign({}, x.add) });
  if (x.adds) x.adds.forEach(([dl, t]) => S.pending.push({ at: S.M + dl + 5, task: Object.assign({}, t) }));
  if (x.inv) invisible(x.inv);
  if (x.mins) S.M += x.mins;
  if (!x.out) { if (e) floatE(e); hide(); S.paused = false; last = performance.now(); hud(); if (G) { const f = G.mech.focus; f && f.isConnected && f.focus({ preventScroll: true }); } return; }
  const out = (S.di === 3 && x.out4) ? x.out4 : x.out;
  const c = COLS[ev.who] ? COLS[ev.who].c : "var(--ink)";
  const delta = e === 0 ? "" : `<span class="delta">${e > 0 ? "+" : "−"}${Math.abs(e)} energy</span>`;
  const bn = banner(ev, x.k === "snap" ? "hurt" : (x.k || x.fish), S.di === 3 && ev.id === "joan" && x.k === "gentle");
  show(`<div class="panel bubble${bn ? " has-banner" : ""}" style="--c:${c}">${bn || portrait(ev.pic, x.mood || ({ along: "calm", snap: "hurt" })[x.k])}<span class="speaker">${ev.speaker}</span><p class="outcome">${out}</p>${delta}<div class="actions"><button class="btn" data-act="ok" data-focus>Back to it</button></div></div>`, "", {
    ok: () => { hide(); S.paused = false; last = performance.now(); hud(); if (G) { const f = G.mech.focus; f && f.isConnected && f.focus({ preventScroll: true }); } }
  });
}

function titleScreen() {
  setPlay(false);
  const art = img("title"), sv = loadSave();
  const btns = sv
    ? `<button class="btn big" data-act="cont" data-late disabled>Continue · ${STAGE_NAME[sv.stage]}</button><button class="btn btn-ghost" data-act="go" data-late disabled>New game</button>`
    : `<button class="btn big" data-act="go" id="startBtn" data-late disabled>Loading…</button>`;
  show(`<div class="fs title-fs">
    ${art ? `<img class="fs-blur" src="${art}" alt=""><img class="fs-bg" src="${art}" alt="Wei Ming feeding Ah Ma porridge in their HDB flat while Chloe does homework and Marcus watches TV">` : ""}
    <div class="fs-cap">
      <h1 class="title-h">The Fifth Column</h1>
      <div class="actions">${btns}</div>
    </div>
  </div>`, "full", { go: newGame, cont: () => resume(loadSave()) });
  const jobs = [];
  if (document.fonts && document.fonts.ready) jobs.push(document.fonts.ready);
  Object.values(IMG_FILES).forEach(src => jobs.push(new Promise(res => { const im = new Image(); im.onload = im.onerror = res; im.src = src; })));
  const minWait = new Promise(res => setTimeout(res, RM ? 200 : 900));
  const timeout = new Promise(res => setTimeout(res, 7000));
  Promise.race([Promise.all([...jobs, minWait]), timeout]).then(() => {
    ov.querySelectorAll("[data-late]").forEach(b => { b.disabled = false; });
    const b = $("#startBtn"); if (b) b.textContent = "Start";
    const f = ov.querySelector("[data-late]"); if (f) f.focus({ preventScroll: true });
  });
}
function newGame() {
  audioInit(); clearSave();
  S = fresh(); S.di = 0; S.d = DAYS[0]; buildBoard();
  PLAY.ms = 0; setPlay(true); storySeen = false; musicStart("day");
  intro();
}
function resume(sv, keepTime) {
  if (!sv) { newGame(); return; }
  audioInit();
  if (G) closeGame();
  closeMenu(); stopAlarm(); rainStop();
  const t = PLAY.ms;
  S = fresh(); Object.assign(S, JSON.parse(JSON.stringify(sv.s)));
  PLAY.ms = keepTime ? t : (sv.play || 0); setPlay(true); storySeen = true;
  musicStart(sv.stage === "day3" || sv.stage === "help" ? "warm" : "day");
  if (sv.stage === "crisis" || sv.stage === "help") { S.di = 2; S.d = DAYS[2]; S.live = false; buildBoard(); if (sv.stage === "crisis") marcus(); else fifth(); }
  else startDay(+sv.stage.slice(3), true);
}

function intro() {

}
function storySlide(i) {
  const sl = STORY[i], art = img(sl.key);
  const body = typeof sl.body === "function" ? sl.body(!!art) : sl.body;
  const last = i + 1 >= STORY.length;
  const next = last ? () => { storySeen = true; howToPlay(); } : () => storySlide(i + 1);
  const label = sl.alarm ? "Turn off the alarm" : last ? "How to play" : "Continue";
  const foot = `<div class="story-foot"><div class="actions"><button class="btn${sl.alarm && art ? " ring" : ""}" data-act="n" data-focus>${label}</button>${last ? "" : `<button class="btn btn-ghost" data-act="skip">Skip story</button>`}</div><span class="story-n">${i + 1} of ${STORY.length}</span></div>`;
  const h = {
    n: b => {
      stopAlarm();
      if (sl.alarm) { const r = $("#ring"); if (r) r.classList.remove("ring"); if (b) b.classList.remove("ring"); setTimeout(next, RM ? 0 : 350); }
      else next();
    },
    skip: () => { stopAlarm(); storySeen = true; howToPlay(); }
  };
  if (art) show(`<div class="fs story-fs"><img class="fs-blur" src="${art}" alt=""><img class="fs-bg" src="${art}" alt="${sl.alt || ""}"><div class="fs-cap"><p class="eyebrow">${sl.eyebrow}</p>${body}${foot}</div></div>`, "full", h);
  else show(`<div class="panel story${sl.night ? " night" : ""}"><p class="eyebrow">${sl.eyebrow}</p>${body}${foot}</div>`, "dark", h);
